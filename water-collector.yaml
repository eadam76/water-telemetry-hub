# Water Data Collector - pulse-counter data acquisition unit.
# This device collects raw measurements only; Home Assistant owns
# historization, statistics and presentation. See REQUIREMENTS.md
# (Hungarian) at the repo root for the full spec.
#
# Production hardware (2026-08-13): Waveshare ESP32-S3-RS485-CAN,
# docs/hardver/esp32-s3-rs485-can-board.md - `board_type`/pulse pins below
# now target it directly. The old non-S3 test board's values are kept
# commented out purely as a reference for whoever needs to go back to
# bench-testing without the real hardware in hand.

substitutions:
  device_name: water-collector
  friendly_device_name: "Water Data Collector"

  # --- Hardware: production (Waveshare ESP32-S3-RS485-CAN) ---
  # esp32-s3-devkitc1-n16r8: the actual chip on this board is an
  # ESP32-S3R8 (per the manufacturer's own PDF, docs/hardver/
  # esp32-s3-rs485-can-board.pdf) - "R8" = 8 MB Octal PSRAM - plus 16 MB
  # flash. The plain `esp32-s3-devkitc-1` preset (N8, no PSRAM) would
  # still boot fine (it just under-declares what's physically there,
  # always safe - the opposite, over-declaring, would try to address
  # memory that doesn't exist), but wastes half the flash and all of the
  # PSRAM for no reason - this preset matches the real hardware exactly
  # (confirmed against the installed esphome package's own boards.py).
  board_type: esp32-s3-devkitc1-n16r8
  meter1_pulse_pin: GPIO1
  meter2_pulse_pin: GPIO2

  # --- Hardware: test phase (older, non-S3 ESP32 devkit) ---
  # board_type: esp32dev
  # meter1_pulse_pin: GPIO32
  # meter2_pulse_pin: GPIO33

esphome:
  name: ${device_name}
  friendly_name: ${friendly_device_name}
  comment: "Water supply data collector - pulse counters (+ pressure sensors planned)"
  # Hand-written Modbus RTU master helpers used by the RS485 bus
  # scan/pressure-poll/re-address logic below - see the header comment in
  # include/rs485_modbus.h for why this isn't ESPHome's built-in
  # modbus_controller: component. Included globally, so every symbol in
  # it (the rs485_modbus:: namespace) is available from any lambda below
  # without its own #include.
  includes:
    - include/rs485_modbus.h

esp32:
  board: ${board_type}
  framework:
    type: esp-idf
    # Paired with the raised httpd max_open_sockets in the local
    # web_server_idf override below (components/web_server_idf/
    # web_server_idf.cpp) - that value can't actually be used if the
    # system-wide LWIP socket pool doesn't have room for it too. ESPHome
    # auto-sizes this from each component's own declared socket needs, but
    # has no visibility into a value hardcoded directly in our forked .cpp
    # (it's not exposed through Python config), so it has to be set
    # explicitly here instead of trusting the auto-calc. Comfortably above
    # web_server_idf's own new max_open_sockets (12) plus headroom for the
    # native api: connection, mDNS, and OTA - cheap relative to the ~100KB
    # free heap this device normally runs with.
    sdkconfig_options:
      CONFIG_LWIP_MAX_SOCKETS: "20"

# Local override of ESPHome's built-in web_server_idf component (components/web_server_idf/,
# a full copy of the upstream 2026.7.3 source with one fix applied) - works around a genuine,
# confirmed use-after-free in web_server_idf.cpp still present upstream as of 2026.7.3 and the
# current esphome/esphome main branch as of 2026-08-10.
#
# Root cause, confirmed by decoding a real crash's backtrace (xtensa-esp32-elf-addr2line
# against the build's own .elf) and reading the actual upstream source:
#   - process_buffer_()'s "stuck EventSource connection" path (fires after ~20s of failed
#     sends - the same symptom power_save_mode: none above was meant to reduce, but doesn't
#     eliminate outright, e.g. a client that goes to sleep/loses network without a clean TCP
#     close can still trigger it) used to call `this->fd_.store(0)` directly.
#   - That makes the very next main-loop tick `delete` the C++ session object - but the
#     underlying httpd session (req->sess_ctx) still points at it, and httpd hasn't actually
#     closed the socket yet.
#   - When httpd later retires that socket for real (its own idle/error handling), it invokes
#     free_ctx (destroy()) on what is by then a dangling pointer - a use-after-free write into
#     already-freed/reused heap memory.
#   - That corruption gets detected later, elsewhere, by an unrelated free() - which is
#     exactly what was observed: `assert failed: block_merge_prev ... "prev block is not free
#     though marked as such"` inside lwIP's own tcpip_thread housekeeping (sys_check_timeouts
#     -> memp_free), a few seconds after a "Closing stuck EventSource connection" log line and
#     the fd's own (already-dangling) "Event source connection closed" log line.
#
# Fix applied in components/web_server_idf/web_server_idf.cpp: that path now only calls the
# proper ESP-IDF API, httpd_sess_trigger_close(), and leaves fd_/deletion to the same safe
# close_fn -> free_ctx path a normal client-initiated disconnect already goes through -
# instead of racing ahead of httpd itself. See the comment at the call site for the full
# writeup. Not yet reported upstream.
#
# If/when this is fixed in a released ESPHome version, this whole external_components block
# (and the components/web_server_idf/ copy) can be deleted again - it's a temporary override,
# not a fork to maintain long-term.
external_components:
  - source:
      type: local
      path: components
    components: [web_server_idf]

# Checkpoint mechanism: every restore_value: true global/number persists
# through this. flash_write_interval already defaults to 60s, spelled out
# explicitly here to keep it traceable against REQUIREMENTS.md.
preferences:
  flash_write_interval: 60s

# level (compile-time ceiling - anything above it is stripped from the
# binary entirely, can never be shown no matter what) is raised to
# VERY_VERBOSE so the include/rs485_modbus.h "modbus" tag's detailed
# wire-level tracing (raw request/reply hex dumps) actually exists in
# the firmware; initial_level (the boot-time default, applies to every
# tag that isn't otherwise overridden) stays at the previous default
# (DEBUG) so nothing gets noisier by default - the "modbus" tag's own
# VERY_VERBOSE detail only turns on when "Debug Log: Modbus" (Log page)
# is switched on, via logger.set_level - see the switch: section below.
logger:
  id: logger_id
  level: VERY_VERBOSE
  initial_level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  # Default (15min, not the 5min the C++ member default alone would
  # suggest - confirmed from api/__init__.py's schema) is: reboot if no
  # *native API* client (HA, `esphome logs`, ...) has connected in that
  # window. That's the right safety net once HA is actually the ongoing
  # primary client - but nothing currently connects over this protocol
  # at all (the custom web dashboard talks plain HTTP/SSE on port 80, a
  # completely different thing) - which meant the device was rebooting
  # itself, unconditionally, every 15 minutes, regardless of whether
  # anything was actually wrong. Disabled for now; once HA is connected
  # and stays connected, this would rarely if ever fire anyway (the
  # countdown resets on every connection), so there's nothing to
  # remember to revert later.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

# RS485 bus to the QDW90A pressure sensors, over the Waveshare
# ESP32-S3-RS485-CAN board's isolated RS485 interface (see
# docs/hardver/esp32-s3-rs485-can-board.md - GPIO17 TX / GPIO18 RX /
# GPIO21 EN). flow_control_pin makes ESPHome's esp-idf UART driver run in
# hardware RS485 half-duplex mode (UART_MODE_RS485_HALF_DUPLEX, confirmed
# from the installed esphome package's own uart_component_esp_idf.cpp) -
# the driver toggles GPIO21 for us on every write_array(), matching the
# board's own spec ("Direction Control: Automatically controlled via
# host hardware flow setting"). 9600 8N1 matches the QDW90A's factory
# default (docs/hardver/qdw90a-modbus-referencia.md) - every sensor has
# to already be on this baud/framing before this device can talk to it
# at all, since the baud itself is one of the only two things (besides
# address) that can differ per sensor and isn't autodetected.
uart:
  id: rs485_uart
  tx_pin: GPIO17
  rx_pin: GPIO18
  flow_control_pin: GPIO21
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

# Backs the "Free Heap" diagnostic sensor below.
debug:

web_server:
  version: 3
  # IMPORTANT: do NOT set `local: true` here. With `local: true` ESPHome
  # serves a fixed, pre-built index.html (baked into the esphome pip
  # package at release time) that never references css_include/js_include
  # at all - our dashboard would compile in fine but never actually load
  # in the browser. css_include/js_include only get wired into the page
  # (<link href=/0.css>, <script type=module src=/0.js>) in the
  # *dynamically generated* index.html, which is what's used when `local`
  # is left at its default (false). See build_index_html() in
  # esphome/components/web_server/__init__.py if this ever needs
  # re-verifying against a newer ESPHome version.
  #
  # That dynamic index.html would otherwise also add a
  # <script src="https://oi.esphome.io/v3/www.js"> for the stock app -
  # blanking js_url removes that tag entirely (falsy value == the
  # generator skips it), so there's still no network dependency. css_url
  # already defaults to empty for version 3.
  js_url: ""
  css_url: ""
  # Our own dark, section-per-page dashboard (web/dashboard.{css,js}) - see
  # the files themselves for how/why. Hides the stock <esp-app> UI and
  # replaces it client-side; still uses ESPHome's normal REST/SSE API
  # underneath, so nothing else here changes.
  css_include: web/dashboard.css
  js_include: web/dashboard.js
  # No `auth:` - deliberate, see REQUIREMENTS.md "Hálózat és biztonság".
  # This is a local-network-only dashboard, meant to also work as an iOS
  # home-screen app; a login screen would only be friction, not a real
  # security boundary (anyone already on the home Wi-Fi reaches it either
  # way). api_encryption_key/ota_password (below) stay secret - those
  # protect the native API and firmware flashing, unrelated to this.
  sorting_groups:
    # Names deliberately generic ("Water Meter 1/2", not "Main"/"Garden") -
    # which physical meter is which is a fact about *this* installation,
    # not something to bake into the firmware. Rename via each meter's own
    # "Display Name" field on the Service page instead - see the note next
    # to friendly_name below.
    - id: sorting_group_meter1
      name: "Water Meter 1"
      sorting_weight: 10
    - id: sorting_group_meter2
      name: "Water Meter 2"
      sorting_weight: 20
    # Pressure sensors: one umbrella group (houses the bus-scan + generic
    # add controls) plus 8 fixed per-slot groups (packages/pressure_sensor.yaml) -
    # see REQUIREMENTS.md "Architekturális megfontolás v3" (2026-08-13) for
    # why 8 (cheap headroom vs. the hub's real 32-node bus capacity, not
    # tied 1:1 to its 4 physical ports anymore). All of this is intercepted
    # client-side into one compact, scan-joined table (web/dashboard.js) -
    # these sorting_group names/weights only matter as internal grouping
    # keys, never shown as literal labels (see pressure_sensor.yaml's own
    # header on why slot numbering is otherwise meaningless).
    - id: sorting_group_pressure
      name: "Pressure Sensors"
      sorting_weight: 30
    - id: sorting_group_pressure1
      name: "Pressure Sensor 1"
      sorting_weight: 31
    - id: sorting_group_pressure2
      name: "Pressure Sensor 2"
      sorting_weight: 32
    - id: sorting_group_pressure3
      name: "Pressure Sensor 3"
      sorting_weight: 33
    - id: sorting_group_pressure4
      name: "Pressure Sensor 4"
      sorting_weight: 34
    - id: sorting_group_pressure5
      name: "Pressure Sensor 5"
      sorting_weight: 35
    - id: sorting_group_pressure6
      name: "Pressure Sensor 6"
      sorting_weight: 36
    - id: sorting_group_pressure7
      name: "Pressure Sensor 7"
      sorting_weight: 37
    - id: sorting_group_pressure8
      name: "Pressure Sensor 8"
      sorting_weight: 38
    - id: sorting_group_network
      name: "Network"
      sorting_weight: 80
    - id: sorting_group_system
      name: "System"
      sorting_weight: 90

# Wi-Fi credentials are deliberately absent here (see REQUIREMENTS.md
# "Hálózat és biztonság"): the device boots with none configured, and gets
# them only at runtime, via BLE (esp32_improv below) or this AP + captive
# portal. Whatever is entered there is saved to the ESP's own flash, not
# to this build.
wifi:
  # Explicit id so the "Forget Wi-Fi" button below can call save_wifi_sta()
  # directly - see the button for why that's the right API for this.
  id: wifi_id
  ap:
    ssid: "${friendly_device_name} Setup"
    # Default is 90s (confirmed from source, wifi/__init__.py's
    # DEFAULT_AP_TIMEOUT) - how long to keep trying a configured network
    # before falling back to this setup AP + BLE improv. This is the exact
    # ~90s delay observed after "Forget Wi-Fi": that button intentionally
    # saves an empty network, so the device is *always* going to end up
    # here - there's nothing to gain from waiting the full default out.
    # Trade-off: this is the same single timeout used for a genuine,
    # temporary Wi-Fi outage (e.g. the router rebooting) - too short and a
    # normal blip could bounce the device into setup mode instead of just
    # waiting it out; too long and Forget Wi-Fi feels broken. 30s is a
    # reasonable middle ground between the two.
    ap_timeout: 30s
  # ESPHome's own default on ESP32 is "light" (modem-sleep power saving) -
  # a well-documented source of exactly the symptom seen on real hardware
  # (dashboard/ping unreachable for many seconds while the device is
  # still alive and logging over serial, web_server_idf logging "Closing
  # stuck EventSource connection after 2500 failed sends" - an ~20s
  # continuous inability to get a single TCP send out). Trades a small
  # amount of extra power draw (irrelevant - this device is always
  # mains/USB powered) for the radio never dropping into a sleep state
  # that can stall an in-progress send.
  power_save_mode: none
  # Real-device symptom: once actually connected, ping to this device shows
  # wide, erratic RTT swings (double-digit ms up to >1s, occasional outright
  # timeouts) with *zero* corresponding wifi:-component log activity (no
  # roam scan, no disconnect/reassociate) - i.e. this isn't a connection
  # drop, it's happening below the level ESPHome's own Wi-Fi state machine
  # would ever log anything about.
  #
  # Root cause: the ESP32 has a single 2.4GHz radio, time-shared between
  # Wi-Fi and Bluetooth (BLE) via coexistence scheduling - and
  # esp32_improv (below) leaves BLE running for the device's entire uptime,
  # not just while unprovisioned, permanently competing with Wi-Fi for
  # radio time. BLE is only actually needed while there's no working Wi-Fi
  # connection to provision it over - once connected, it's pure overhead.
  # Confirmed from source (esp32_ble/ble.cpp) that ble.disable/ble.enable
  # actually tear down/reinit the BLE stack (not just stop advertising),
  # and that esp32_improv's own stop() (called automatically once Wi-Fi
  # connects - see esp32_improv_component.cpp's check_wifi_connection_())
  # only stops its own GATT service, never the underlying BLE stack -
  # explaining why BLE was confirmed still active (BLE Client connected
  # seen in a real log) long after Wi-Fi provisioning was already done.
  #
  # Confirmed (not just plausible) by a real captured log: during a mesh
  # roaming/auth-storm episode (repeated "Auth Expired"/"Association
  # Expired" across every BSSID for close to an hour), BLE advertising
  # writes (BTM_BleWriteAdvData/BTM_BleWriteScanRsp) were seen firing
  # seconds apart from failed reconnect attempts - because naive
  # on_disconnect: ble.enable turns BLE back on *immediately* on every
  # single disconnect, including the ones in the middle of that storm,
  # so the radio is contending with itself for the whole duration. Every
  # failed auth attempt keeps the link down, which keeps BLE on, which
  # keeps contending - a self-sustaining feedback loop, not just jitter.
  #
  # Fix: re-enable BLE through a restart-mode script with a grace delay
  # instead of instantly. A single, isolated disconnect (the common case -
  # reconnects in seconds) never actually turns BLE on at all, since
  # on_connect cancels the pending script before the delay elapses. Only
  # a disconnection that's still ongoing after the full grace period
  # actually enables BLE - by which point a normal reconnect would already
  # have succeeded, so it's a genuine extended outage where local BLE
  # recovery access is worth the radio contention. The original
  # "BLE only goes away while there's a working Wi-Fi connection, comes
  # back the instant that's no longer true" intent is preserved, just
  # debounced against the reconnect storm actively sabotaging itself.
  on_connect:
    - script.stop: reenable_ble_after_disconnect
    - ble.disable
  on_disconnect:
    - script.execute: reenable_ble_after_disconnect
  # Real-device root cause, confirmed from source (wifi_component.h/.cpp):
  # while connected, ESPHome checks the current signal every 5 minutes
  # (ROAMING_CHECK_INTERVAL) and, if it's below -49 dBm (ROAMING_GOOD_RSSI -
  # not a total loss, just "not excellent"), proactively runs an active
  # scan (the "Roam scan" log line) looking for a better BSSID of the same
  # SSID - i.e. another node on this mesh. That scan itself involves
  # channel-hopping, which can miss beacons from the AP actually in use -
  # this matches a real captured cascade exactly: "Roam scan (-86 dBm...)"
  # immediately followed by "Disconnected ... reason='Beacon Timeout'".
  # On a well-behaved mesh this proactive roaming is the point (it's what
  # makes "mesh" better than isolated APs); on this one it was plausibly
  # self-inflicted instability - actively going looking for a better node
  # made a marginal-but-working link worse, rather than staying put.
  #
  # post_connect_roaming: false only disables that proactive, still-
  # connected background check - it does NOT touch the normal reconnect
  # logic at all, which is a separate code path that already runs
  # unconditionally on an actual disconnect (a real Beacon Timeout, the AP
  # going away, etc.) regardless of this setting. So this is exactly
  # "don't go looking for a better node while things still work; still
  # reconnect immediately and fully if the link genuinely drops" - not a
  # blanket "never roam".
  post_connect_roaming: false

# Backs the wifi: on_disconnect/on_connect BLE debounce above - see the
# comment there for why this exists (grace period before turning BLE back
# on, so it doesn't contend with Wi-Fi during a fast/self-resolving
# reconnect). mode: restart so a fresh disconnect always gets the full
# delay again, and on_connect's script.stop cleanly cancels a pending
# enable if Wi-Fi comes back before the delay elapses - it's a no-op if
# the script isn't running.
script:
  - id: reenable_ble_after_disconnect
    mode: restart
    then:
      - delay: 2min
      - ble.enable

captive_portal:

esp32_improv:
  authorizer: none

sensor:
  # entity_category: diagnostic on everything below - it's what routes
  # these onto the dashboard's "Diagnostics" page (see web/dashboard.js:
  # pageFor()) instead of the primary "Home" page, which is reserved for
  # the meters' own readings.
  #
  # disabled_by_default: true throughout this file and water_meter.yaml
  # (except each meter's own Flow Rate/Total Consumption - the device's
  # actual job): Home Assistant registers every entity enabled by default
  # on first discovery, regardless of ESPHome's own entity_category - HA
  # has no concept of "diagnostic/config, so hide it", that's a purely
  # ESPHome-side dashboard convention. Without this, connecting HA would
  # surface two dozen entities at once, most of which either aren't
  # useful there (this dashboard's own visibility toggles, timing knobs)
  # or are actively misleading out of context (a "Firmware Version" with
  # no HA-side update mechanism looks like it should mean something it
  # doesn't). disabled_by_default doesn't remove or hide anything from
  # THIS custom dashboard - it talks to the device directly over its own
  # REST/SSE API, never through HA's entity registry, so it's completely
  # unaffected either way. It only changes HA's own starting state; still
  # a normal entity, one opt-in click away if ever needed there.
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    # Was 60s - far too slow to actually see anything with (found live: a
    # hand placed near the board dropped the connection immediately, but
    # the dashboard's own signal reading was up to a minute stale, so it
    # never showed the drop happening - just silence, then a reconnect).
    # This reads already-known radio state (esp_wifi_sta_get_ap_info()) -
    # no scan, no extra airtime, effectively free - so there's no real cost
    # to polling it this often. Paired with the header signal-bars readout
    # in web/dashboard.js/.css, this is what makes an antenna-sensitivity
    # theory like that actually visible and testable live, instead of
    # something you can only infer after the fact from a disconnect reason.
    update_interval: 2s
    entity_category: diagnostic
    disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_network
      sorting_weight: 10

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_system
      sorting_weight: 10

  - platform: internal_temperature
    name: "Unit Temperature"
    entity_category: diagnostic
    disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_system
      sorting_weight: 20

  - platform: debug
    free:
      name: "Free Heap"
      entity_category: diagnostic
      disabled_by_default: true
      web_server:
        sorting_group_id: sorting_group_system
        sorting_weight: 30

text_sensor:
  # Latest bus-scan result - a comma-separated list of Modbus addresses
  # that answered (e.g. "1,4,9"), published by "Pressure Sensors Scan
  # Bus" below (rs485_modbus::scan_bus(), include/rs485_modbus.h).
  # Read-only/diagnostic: the dashboard's own JS parses this to find
  # not-yet-registered addresses (registered slots' own live online/
  # offline status instead comes from each slot's own continuous poll -
  # see packages/pressure_sensor.yaml's "Online" binary_sensor) - see
  # web/dashboard.js's pressure-table section. Never itself persisted - a
  # scan result is only ever as fresh as the last scan.
  - platform: template
    id: pressure_scan_results
    name: "Pressure Sensors Scan Results"
    icon: "mdi:radar"
    entity_category: diagnostic
    disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_pressure
      sorting_weight: 3

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
      disabled_by_default: true
      web_server:
        sorting_group_id: sorting_group_network
        sorting_weight: 20
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic
      disabled_by_default: true
      web_server:
        sorting_group_id: sorting_group_network
        sorting_weight: 30

  # Kept, despite the fair "what's the point if you can't update from
  # here" objection - this isn't meant to claim "you're up to date", just
  # to report which build is actually flashed right now, which has been
  # genuinely useful for real debugging in this project already (matching
  # a crash log's timestamp to the exact source it was built from).
  # disabled_by_default rather than removed: costs HA nothing while
  # unused, still there to check on demand.
  - platform: version
    name: "Firmware Version"
    entity_category: diagnostic
    disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_system
      sorting_weight: 40

  - platform: debug
    device:
      name: "Reset Reason"
      entity_category: diagnostic
      disabled_by_default: true
      web_server:
        sorting_group_id: sorting_group_system
        sorting_weight: 50

switch:
  # Turns the "modbus" log tag (include/rs485_modbus.h) up to
  # VERY_VERBOSE - raw request/reply hex dumps for every Modbus
  # transaction, plus per-scan/per-poll detail - and back down to the
  # normal DEBUG default. Off by default: at VERY_VERBOSE a full bus
  # scan alone would log ~250 lines, not something to leave running.
  # Intercepted by the dashboard's own JS (see the "Log page" section of
  # web/dashboard.js) and mounted directly into the Log page's toolbar,
  # not the generic Service list - rendered via the normal fallback
  # there too if that interception ever doesn't fire (e.g. in Home
  # Assistant, which has no such special-casing).
  - platform: template
    id: debug_log_modbus
    name: "Debug Log: Modbus"
    icon: "mdi:bug-outline"
    entity_category: diagnostic
    disabled_by_default: true
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: sorting_group_system
      sorting_weight: 60
    turn_on_action:
      - logger.set_level:
          level: VERY_VERBOSE
          tag: "modbus"
    turn_off_action:
      - logger.set_level:
          level: DEBUG
          tag: "modbus"

button:
  # entity_category: config -> dashboard "Service" page, alongside the
  # meters' own Update buttons (a device-level action still belongs there,
  # not on Diagnostics, which is read-only info).
  - platform: restart
    name: "Restart"
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_system
      sorting_weight: 90

  # Clears *only* the saved Wi-Fi credentials and reboots into provisioning
  # mode (fallback AP + BLE improv) - everything else (calibration offsets,
  # zero-flow timeouts, display names, the Show on Dashboard toggles) stays
  # exactly as it was. The actual, common need this answers: physically
  # moving the device to a different Wi-Fi network.
  #
  # save_wifi_sta(ssid, password) (confirmed public in wifi_component.h) is
  # the same call esp32_improv itself makes when new BLE-provisioned
  # credentials come in - it writes to the wifi component's own,
  # dedicated preference slot (SavedWifiSettings) and flushes immediately
  # (global_preferences->sync() inside it already), never touching any of
  # this project's own preference keys (offset_m3 etc - see
  # water_meter.yaml). Calling it with empty strings clears that slot the
  # same way; the reboot then finds no usable saved network, and (matching
  # exactly what a truly first-boot/freshly-flashed device does today, per
  # real captured logs) goes straight to the fallback AP + BLE improv,
  # ready to be reprovisioned like new - without losing anything else.
  #
  # This is deliberately a *narrower* action than Factory Reset below, and
  # covers the actual common case that one existed for ("switch to a
  # different hotspot") without its side effect of wiping calibration too.
  - platform: template
    name: "Forget Wi-Fi"
    icon: "mdi:wifi-off"
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_system
      sorting_weight: 91
    on_press:
      - lambda: |-
          id(wifi_id).save_wifi_sta("", "");
      - delay: 100ms
      - lambda: App.safe_reboot();

  # Wipes ALL settings (Wi-Fi included, calibration/timeouts/display names
  # too) and reboots into provisioning mode - the "Forget Wi-Fi" button
  # above now covers the actual common reason to do this (switching
  # networks) without the side effect of losing calibration too; this
  # stays as a genuine last-resort/stuck-state fallback, not the everyday
  # tool for a network change.
  #
  # Deliberately left off the custom web UI entirely (dashboard.js skips
  # any button named "Factory Reset..." outright, not just a confirm
  # dialog) - stays reachable through the Home Assistant API/entity if
  # ever needed there, just not one accidental tap away on the device's
  # own page. disabled_by_default too, so it isn't even a default-visible
  # HA entity - has to be deliberately opted into there as well.
  - platform: factory_reset
    name: "Factory Reset (incl. Wi-Fi)"
    disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_system
      sorting_weight: 92

  # Real bus-scan (v3) - sweeps every Modbus address (1-247) with a short
  # per-address timeout (rs485_modbus::scan_bus(), include/rs485_modbus.h)
  # and publishes whichever ones answered as a CSV to "Scan Results"
  # above. A full sweep takes a few seconds (see that function's own
  # comment for why it's deliberately not run on a fast interval) - this
  # button is what the dashboard's "New device" rows are found by; a
  # registered slot's own live status instead comes from its continuous
  # per-slot poll (packages/pressure_sensor.yaml's "Online" binary_sensor),
  # not from this button.
  - platform: template
    id: pressure_scan
    name: "Pressure Sensors Scan Bus"
    icon: "mdi:radar"
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_pressure
      sorting_weight: 5
    on_press:
      - lambda: |-
          auto found = rs485_modbus::scan_bus(id(rs485_uart), 1, 247);
          std::string csv;
          for (size_t i = 0; i < found.size(); i++) {
            if (i > 0) csv += ",";
            csv += std::to_string(found[i]);
          }
          id(pressure_scan_results).publish_state(csv);

  # Registers the first still-free pressure sensor slot (out of the 8 in
  # packages/pressure_sensor.yaml) with the address+name set in "Pressure
  # Sensors Add Target Address"/"...Add Name" below - the dashboard sets
  # both of those (from a scan-discovered "New device" row) immediately
  # before pressing this, so from the user's perspective it looks like a
  # per-row "Add" button, even though underneath it's one shared trigger -
  # see the per-slot try_register script for why trying all 8 in a fixed
  # sequence (rather than picking one directly) is safe and correct: the
  # first slot whose address is still 0 is the one that actually claims
  # it, every other call in this list is a no-op. Slot order itself is
  # never shown anywhere - see pressure_sensor.yaml's header.
  - platform: template
    id: pressure_add
    name: "Pressure Sensors Add"
    icon: "mdi:plus"
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_pressure
      sorting_weight: 20
    on_press:
      - script.execute:
          id: slot1_try_register
          name: !lambda 'return id(pressure_add_name).state;'
          address: !lambda 'return (int) id(pressure_add_address).state;'
      - script.execute:
          id: slot2_try_register
          name: !lambda 'return id(pressure_add_name).state;'
          address: !lambda 'return (int) id(pressure_add_address).state;'
      - script.execute:
          id: slot3_try_register
          name: !lambda 'return id(pressure_add_name).state;'
          address: !lambda 'return (int) id(pressure_add_address).state;'
      - script.execute:
          id: slot4_try_register
          name: !lambda 'return id(pressure_add_name).state;'
          address: !lambda 'return (int) id(pressure_add_address).state;'
      - script.execute:
          id: slot5_try_register
          name: !lambda 'return id(pressure_add_name).state;'
          address: !lambda 'return (int) id(pressure_add_address).state;'
      - script.execute:
          id: slot6_try_register
          name: !lambda 'return id(pressure_add_name).state;'
          address: !lambda 'return (int) id(pressure_add_address).state;'
      - script.execute:
          id: slot7_try_register
          name: !lambda 'return id(pressure_add_name).state;'
          address: !lambda 'return (int) id(pressure_add_address).state;'
      - script.execute:
          id: slot8_try_register
          name: !lambda 'return id(pressure_add_name).state;'
          address: !lambda 'return (int) id(pressure_add_address).state;'
      - text.set:
          id: pressure_add_name
          value: ""
      - number.set:
          id: pressure_add_address
          value: 0

text:
  # Set by the dashboard (not typed by hand in normal use) immediately
  # before pressing "Pressure Sensors Add" - see that button's own
  # comment. Not persisted (restore_value unset/false): a transient
  # scratch field, cleared back to empty right after Add fires.
  - platform: template
    id: pressure_add_name
    name: "Pressure Sensors Add Name"
    icon: "mdi:form-textbox"
    mode: text
    optimistic: true
    min_length: 0
    max_length: 32
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_pressure
      sorting_weight: 10

number:
  # Set by the dashboard immediately before pressing "Pressure Sensors
  # Add" - see that button's own comment. Not persisted: transient,
  # cleared back to 0 right after Add fires.
  - platform: template
    id: pressure_add_address
    name: "Pressure Sensors Add Target Address"
    icon: "mdi:identifier"
    mode: box
    min_value: 0
    max_value: 247
    step: 1
    optimistic: true
    restore_value: false
    initial_value: 0
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_pressure
      sorting_weight: 15

packages:
  # friendly_name is deliberately generic ("Water Meter 1/2", not "Main"/
  # "Garden") - which physical meter is which is a fact about *this*
  # installation, not the firmware; it drives both the compiled-in entity
  # names (e.g. "Water Meter 1 Reading") and the "Display Name" field's
  # starting value, which is what you'd actually rename on the Service
  # page ("Main Meter"/"Garden Meter", or whatever fits) without needing
  # a recompile. id_prefix (meter1/meter2 below), same reasoning - purely
  # internal, never shown anywhere. Changing an *existing*, already-
  # calibrated meter's id_prefix later would still reset its saved
  # calibration though (it's part of the flash preference key for
  # offset_m3 - see water_meter.yaml) - a non-issue this early on, before
  # anything's built on top of these entities (no HA setup yet), but not
  # a free rename anymore once that's no longer true.
  meter1: !include
    file: packages/water_meter.yaml
    vars:
      id_prefix: meter1
      friendly_name: "Water Meter 1"
      pulse_pin: ${meter1_pulse_pin}
      liters_per_pulse: "1.0"
      zero_flow_timeout_default: "60"
      sorting_group_id: sorting_group_meter1

  meter2: !include
    file: packages/water_meter.yaml
    vars:
      id_prefix: meter2
      friendly_name: "Water Meter 2"
      pulse_pin: ${meter2_pulse_pin}
      liters_per_pulse: "1.0"
      zero_flow_timeout_default: "60"
      sorting_group_id: sorting_group_meter2

  # 8 fixed pressure sensor slots (cheap headroom vs. the hub's real
  # 32-node bus capacity - see REQUIREMENTS.md "Architekturális
  # megfontolás v3", 2026-08-13) - see packages/pressure_sensor.yaml's own
  # header for the id_prefix/friendly_name rename caveat and the current
  # (real Modbus RTU over `uart: rs485_uart` above) status.
  pressure_slot1: !include
    file: packages/pressure_sensor.yaml
    vars:
      id_prefix: slot1
      friendly_name: "Pressure Sensor 1"
      sorting_group_id: sorting_group_pressure1

  pressure_slot2: !include
    file: packages/pressure_sensor.yaml
    vars:
      id_prefix: slot2
      friendly_name: "Pressure Sensor 2"
      sorting_group_id: sorting_group_pressure2

  pressure_slot3: !include
    file: packages/pressure_sensor.yaml
    vars:
      id_prefix: slot3
      friendly_name: "Pressure Sensor 3"
      sorting_group_id: sorting_group_pressure3

  pressure_slot4: !include
    file: packages/pressure_sensor.yaml
    vars:
      id_prefix: slot4
      friendly_name: "Pressure Sensor 4"
      sorting_group_id: sorting_group_pressure4

  pressure_slot5: !include
    file: packages/pressure_sensor.yaml
    vars:
      id_prefix: slot5
      friendly_name: "Pressure Sensor 5"
      sorting_group_id: sorting_group_pressure5

  pressure_slot6: !include
    file: packages/pressure_sensor.yaml
    vars:
      id_prefix: slot6
      friendly_name: "Pressure Sensor 6"
      sorting_group_id: sorting_group_pressure6

  pressure_slot7: !include
    file: packages/pressure_sensor.yaml
    vars:
      id_prefix: slot7
      friendly_name: "Pressure Sensor 7"
      sorting_group_id: sorting_group_pressure7

  pressure_slot8: !include
    file: packages/pressure_sensor.yaml
    vars:
      id_prefix: slot8
      friendly_name: "Pressure Sensor 8"
      sorting_group_id: sorting_group_pressure8
