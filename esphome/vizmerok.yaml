# Vízellátó rendszer felügyelet - impulzusszámláló modul
# Lásd: REQUIREMENTS.md a repó gyökerében.
#
# Kezdeti tesztelés: `board_type`/`fomero_pulse_pin`/`locsolo_pulse_pin`
# egy régebbi, nem S3 ESP32 devkitre van állítva (lásd lent). Amikor
# megérkezik a végleges hardver (Waveshare ESP32-S3-RS485-CAN,
# docs/hardver/esp32-s3-rs485-can-board.md), ezt a néhány substitutiont kell
# átírni: board_type -> esp32-s3-devkitc-1, a pulzus-pinek -> GPIO1 / GPIO2.

substitutions:
  device_name: vizmerok
  friendly_device_name: "Vízellátó rendszer"

  # --- Hardver: teszt fázis (nem S3 board) ---
  board_type: esp32dev
  fomero_pulse_pin: GPIO32
  locsolo_pulse_pin: GPIO33

  # --- Hardver: végleges (Waveshare ESP32-S3-RS485-CAN) ---
  # board_type: esp32-s3-devkitc-1
  # fomero_pulse_pin: GPIO1
  # locsolo_pulse_pin: GPIO2

esphome:
  name: ${device_name}
  friendly_name: ${friendly_device_name}

esp32:
  board: ${board_type}
  framework:
    type: esp-idf

# Checkpoint mechanizmus: minden restore_value: true global/number ezen
# keresztül perzisztálódik. flash_write_interval alapértéke már 60s,
# de explicit kiírva a REQUIREMENTS.md-vel való megfeleltethetőség kedvéért.
preferences:
  flash_write_interval: 60s

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Nem HA-entitás, csak diagnosztikára és a helyi admin felületre (lásd
# REQUIREMENTS.md "Home Assistant adatmodell" - checkpoint időköz).
web_server:
  version: 3
  auth:
    username: admin
    password: !secret web_server_password

# Szándékosan NINCS itt ssid/password: a Wi-Fi hitelesítő adat sosem kerül
# fordítási időben a firmware-be (lásd REQUIREMENTS.md "Hálózat és
# biztonság"). Az eszköz üresen bootol; a lenti `ap:` (Wi-Fi hotspot +
# captive portal) és az `esp32_improv:` (BLE) ad módot a Wi-Fi megadására
# az első indításkor - amit ott megadnak, azt az ESP a saját flash-ébe
# menti (nem a mi buildünkbe), onnantól magától csatlakozik újraindítás
# után is.
wifi:
  ap:
    ssid: "${friendly_device_name} beallitas"

captive_portal:

# Bluetooth (BLE) alapú kezdeti Wi-Fi provisioning - lásd REQUIREMENTS.md
# "Hálózat és biztonság". `authorizer: none` -> nincs fizikai gomb feltétel,
# a provisioning mindig elérhető, amíg a Wi-Fi nincs beállítva.
esp32_improv:
  authorizer: none

packages:
  fomero: !include
    file: packages/pulse_water_meter.yaml
    vars:
      id_prefix: fomero
      friendly_name: "Fő vízmérő"
      pulse_pin: ${fomero_pulse_pin}
      liters_per_pulse: "1.0"
      zero_flow_timeout_default: "60"

  locsolo: !include
    file: packages/pulse_water_meter.yaml
    vars:
      id_prefix: locsolo
      friendly_name: "Locsoló mérő"
      pulse_pin: ${locsolo_pulse_pin}
      liters_per_pulse: "1.0"
      zero_flow_timeout_default: "60"
