# Impulzusszámláló vízóra modul – újrafelhasználható ESPHome csomag.
#
# Egy vízórához tartozó teljes logika: impulzusérzékelés, offset_m3/pulse_count
# elszámolási modell, checkpoint-perzisztencia, nulla-átfolyás timeout watchdog,
# kézi szinkron. Lásd a repó gyökerében a REQUIREMENTS.md-t a részletes
# indoklásért.
#
# Vízóránként a fő konfigból (vizmerok.yaml) `!include ... vars:`-szal kell
# példányosítani, minden `vars` kötelező:
#   id_prefix                 - egyedi azonosító-előtag, pl. fomero / locsolo
#   friendly_name              - megjelenített név, pl. "Fő vízmérő"
#   pulse_pin                  - GPIO szám (szám vagy string), az IZAR PULSE
#                                 fehér (impulzus) vezetéke
#   liters_per_pulse           - l/impulzus, a fehér (1:1) vezetéken 1.0
#   zero_flow_timeout_default  - nulla-átfolyás timeout alapértéke, mp (szám)

globals:
  # Checkpoint-perzisztens, monoton (normál futás közben) impulzusszám.
  # Csak a total: on_value és a boot-seed írja; a periodikus flash-checkpointot
  # a preferences: flash_write_interval szabályozza (lásd vizmerok.yaml).
  - id: ${id_prefix}_pulse_count
    type: uint32_t
    restore_value: true
    initial_value: "0"

  # Korrekciós eltolás (m3), kizárólag kézi szinkronkor módosul, akkor
  # azonnal (flash_write_interval-től függetlenül) perzisztálva.
  - id: ${id_prefix}_offset_m3
    type: float
    restore_value: true
    initial_value: "0"

  # Az utolsó érvényes impulzus millis() időbélyege - a nulla-átfolyás
  # watchdog-hoz. Szándékosan NEM perzisztens: minden újraindítás után a
  # "most bootoltunk, még nem tudjuk mikor volt az utolsó impulzus" állapot
  # a helyes kiindulás, nem egy réginek bizonyuló, korábbi munkameneti érték.
  - id: ${id_prefix}_last_pulse_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

sensor:
  # Impulzusráta (diagnosztika, nyers, kalibrálatlan jel) + a beépített
  # `total` alszenzor, ami a pulse_meter komponens saját, "boot óta" számlált
  # nyers impulzusösszege - ezt SOSEM tesszük ki HA-nak közvetlenül
  # (internal: true), csak forrásként szolgál a perzisztens pulse_count-hoz.
  #
  # A pergésmentesítés (internal_filter) itt fordításidőben rögzített,
  # nem futásidőben állítható paraméter - lásd REQUIREMENTS.md Kalibráció.
  # 10 ms: jóval az IZAR PULSE minimális impulzushossza (50 ms) alatt, hogy
  # valós impulzust ne szűrjön ki, de a zajtüskéket kiszűrje.
  - platform: pulse_meter
    id: ${id_prefix}_pulse_rate
    name: "${friendly_name} Impulzusráta"
    pin:
      number: ${pulse_pin}
      mode: INPUT_PULLUP
    internal_filter: 10ms
    accuracy_decimals: 2
    total:
      id: ${id_prefix}_pulse_total
      internal: true
      accuracy_decimals: 0
      state_class: ""
      on_value:
        then:
          - lambda: |-
              // A pulse_meter total-ja a boot-seed (lásd on_boot) óta már
              // az abszolút impulzusszámot adja - ez a pulse_count egyetlen
              // írási helye normál üzemben.
              uint32_t new_count = (uint32_t) x;
              id(${id_prefix}_pulse_count) = new_count;
              id(${id_prefix}_last_pulse_ms) = millis();
              id(${id_prefix}_total_pulses).publish_state(new_count);
              float total_m3 = id(${id_prefix}_offset_m3) + (new_count * (float) ${liters_per_pulse}) / 1000.0f;
              id(${id_prefix}_total_consumption).publish_state(total_m3);
    on_value:
      then:
        - lambda: |-
            // Térfogatáram ugyanabból a periódusidő-alapú mérésből
            // származik, mint az Impulzusráta - konzisztens a kettő.
            id(${id_prefix}_flow_rate).publish_state(x * (float) ${liters_per_pulse});

  # Térfogatáram - kalibrált (liters_per_pulse-szel szorzott) érték,
  # kizárólag az Impulzusráta on_value-jából frissül, nincs saját
  # frissítési ütemezése.
  - platform: template
    id: ${id_prefix}_flow_rate
    name: "${friendly_name} Térfogatáram"
    unit_of_measurement: "L/min"
    accuracy_decimals: 3
    state_class: measurement

  # Összes fogyasztás - a HA-oldali hosszú távú statisztika elsődleges
  # forrása. offset_m3 + pulse_count * liters_per_pulse / 1000.
  - platform: template
    id: ${id_prefix}_total_consumption
    name: "${friendly_name} Összes fogyasztás"
    unit_of_measurement: "m³"
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 3

  # Összes impulzus - diagnosztika, a perzisztens pulse_count nyers
  # kiolvasása. Szándékosan NINCS state_class: nem kell rá HA-statisztika
  # (arra az Összes fogyasztás szolgál), és checkpoint-alapú perzisztencia
  # miatt ugyanúgy visszaugorhatna tápvesztéskor, mint maga a pulse_count.
  - platform: template
    id: ${id_prefix}_total_pulses
    name: "${friendly_name} Összes impulzus"
    unit_of_measurement: "impulzus"
    accuracy_decimals: 0

number:
  # Fizikai vízóra állásának megadása (m3) - csak bemeneti mező, önmagában
  # nem alkalmazódik, a "Szinkronizálás" gomb olvassa ki.
  - platform: template
    id: ${id_prefix}_sync_target
    name: "${friendly_name} Fizikai óraállás (m³)"
    unit_of_measurement: "m³"
    mode: box
    min_value: 0
    max_value: 100000
    step: 0.001
    optimistic: true
    initial_value: 0

  # Nulla-átfolyás timeout - futásidőben állítható, alacsony szintű
  # paraméter (lásd REQUIREMENTS.md "Pillanatnyi átfolyás számítása").
  # restore_value: true -> túléli az újraindítást is.
  - platform: template
    id: ${id_prefix}_zero_flow_timeout
    name: "${friendly_name} Nulla-átfolyás timeout"
    unit_of_measurement: "s"
    mode: box
    min_value: 10
    max_value: 600
    step: 1
    optimistic: true
    restore_value: true
    initial_value: ${zero_flow_timeout_default}

button:
  # Kézi szinkron alkalmazása: offset_m3 újraszámolása úgy, hogy az Összes
  # fogyasztás azonnal a megadott célértékre álljon, a pulse_count
  # (diagnosztikai impulzusszám) törése nélkül. Azonnali, checkpointtól
  # független perzisztálással.
  - platform: template
    id: ${id_prefix}_sync_apply
    name: "${friendly_name} Szinkronizálás"
    on_press:
      - lambda: |-
          float target = id(${id_prefix}_sync_target).state;
          float measured_m3 = (id(${id_prefix}_pulse_count) * (float) ${liters_per_pulse}) / 1000.0f;
          id(${id_prefix}_offset_m3) = target - measured_m3;
          global_preferences->sync();
          id(${id_prefix}_total_consumption).publish_state(target);

interval:
  # Nulla-átfolyás watchdog: ha `timeout`-nyi ideig nem jött új impulzus,
  # a Térfogatáram (és ezen keresztül, az on_value láncon át, semmi más,
  # mert az Impulzusráta a forrás) explicit 0-ra áll. Csak akkor publikál,
  # ha még nem 0, hogy ne generáljon felesleges, ismétlődő state-eket.
  - interval: 1s
    then:
      - lambda: |-
          if (id(${id_prefix}_pulse_rate).state != 0) {
            uint32_t timeout_ms = (uint32_t) (id(${id_prefix}_zero_flow_timeout).state * 1000);
            uint32_t elapsed_ms = millis() - id(${id_prefix}_last_pulse_ms);
            if (elapsed_ms > timeout_ms) {
              id(${id_prefix}_pulse_rate).publish_state(0);
            }
          }

esphome:
  on_boot:
    # Alapértelmezett prioritás: minden komponens setup()-ja (így a
    # restore_value globálisok visszaállítása is) ezt megelőzően lefut.
    then:
      # A pulse_meter saját, boot óta számlált total-ját a perzisztens
      # pulse_count-ra állítjuk, hogy onnantól a total: on_value már az
      # abszolút (nem csak "boot óta") impulzusszámot adja.
      - pulse_meter.set_total_pulses:
          id: ${id_prefix}_pulse_rate
          value: !lambda 'return id(${id_prefix}_pulse_count);'
      # A set_total_pulses fenti hívása a `total:` alszenzort is publikálja,
      # ami szinkron módon lefuttatja a 65-76. soros on_value láncot - az
      # Összes impulzus, Összes fogyasztás és last_pulse_ms már ott
      # frissül (pulse_count önmagára, no-op). Itt már csak az
      # Impulzusrátát kell explicit nullázni induláskor, ami a saját
      # on_value-ján (82. sor) át a Térfogatáramra is kaszkádozik - így
      # egyetlen helyen sincs duplikált logika.
      - lambda: |-
          id(${id_prefix}_pulse_rate).publish_state(0);
