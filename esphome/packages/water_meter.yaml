# Water meter pulse-counter channel - reusable ESPHome package.
#
# Full logic for one water meter: pulse sensing, the offset_m3/pulse_count
# accounting model, checkpoint persistence, zero-flow timeout watchdog,
# manual calibration sync. See REQUIREMENTS.md (Hungarian) at the repo root
# for the full rationale.
#
# Instantiate per meter from the top-level config (water-collector.yaml)
# via `!include ... vars:`. Required vars:
#   id_prefix                 - unique internal id prefix, e.g. meter1 /
#                                meter2 (never shown anywhere - see the
#                                note next to offset_m3 below before ever
#                                changing an existing one)
#   friendly_name             - display name, deliberately generic, e.g.
#                                "Water Meter 1" - also the "Display Name"
#                                field's starting value (see the text:
#                                section below), which is what you'd
#                                actually rename per-installation
#   pulse_pin                 - GPIO number (int or string), the IZAR PULSE
#                                white (pulse) wire
#   liters_per_pulse          - liters/pulse, 1.0 on the white (1:1) wire
#   zero_flow_timeout_default - default zero-flow timeout, seconds (number)
#   sorting_group_id          - web_server sorting group id for this meter's
#                                card section (declared in water-collector.yaml)

globals:
  # Checkpoint-persistent, monotonic (during normal runtime) pulse count.
  # Only written by the total: on_value handler and the boot-seed step;
  # the periodic flash checkpoint is governed by preferences:
  # flash_write_interval (see water-collector.yaml).
  - id: ${id_prefix}_pulse_count
    type: uint32_t
    restore_value: true
    initial_value: "0"

  # Calibration offset (m3), changes only on manual sync.
  # NOT restore_value: true - that mechanism only saves via the globals
  # component's own 1s polling (memcmp in its update()), so an immediate
  # global_preferences->sync() call right after assignment would see
  # nothing queued yet: the sync button would only persist on a SECOND
  # press, one polling cycle later. Handled instead with our own
  # ESPPreferenceObject, saved explicitly and immediately (see the
  # "Update" button and the boot-load lambdas below) - keyed on
  # fnv1a_hash("${id_prefix}_offset_m3"), so changing an *existing*
  # meter's id_prefix loses its saved calibration (the new key just
  # won't find the old flash entry) - a one-time re-sync after reflashing
  # is the only consequence, not a functional problem, but worth knowing
  # before renaming one.
  - id: ${id_prefix}_offset_m3
    type: float
    restore_value: false
    initial_value: "0"

  # millis() timestamp of the last valid pulse - for the zero-flow
  # watchdog. Deliberately NOT persistent: after every restart, "we just
  # booted, we don't yet know when the last pulse was" is the correct
  # starting state, not a stale value from a previous session.
  - id: ${id_prefix}_last_pulse_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

sensor:
  # Pulse Rate (diagnostic, raw, uncalibrated signal) + the built-in
  # `total` sub-sensor, which is the pulse_meter component's own "since
  # boot" raw pulse total - never exposed to HA directly (internal: true),
  # only used as the source for the persistent pulse_count.
  #
  # Debounce (internal_filter) is a compile-time, not runtime-configurable
  # parameter here - see REQUIREMENTS.md "Kalibráció". 10 ms: well below
  # the IZAR PULSE's minimum pulse width (50 ms), so it won't filter out a
  # real pulse, while still rejecting noise spikes.
  - platform: pulse_meter
    id: ${id_prefix}_pulse_rate
    name: "${friendly_name} Pulse Rate"
    icon: "mdi:pulse"
    pin:
      number: ${pulse_pin}
      mode: INPUT_PULLUP
    internal_filter: 10ms
    accuracy_decimals: 2
    entity_category: diagnostic
    # disabled_by_default throughout this file (except Flow Rate/Total
    # Consumption below - the device's actual job) - see the longer note
    # next to the first sensor: in water-collector.yaml for why. Doesn't
    # affect this custom dashboard at all, which never goes through HA's
    # entity registry either way.
    disabled_by_default: true
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 40
    total:
      id: ${id_prefix}_pulse_total
      internal: true
      accuracy_decimals: 0
      state_class: ""
      on_value:
        then:
          - lambda: |-
              // The pulse_meter total already reflects the absolute pulse
              // count since the boot-seed (see on_boot) - this is
              // pulse_count's only write site during normal operation.
              uint32_t new_count = (uint32_t) x;
              id(${id_prefix}_pulse_count) = new_count;
              id(${id_prefix}_last_pulse_ms) = millis();
              id(${id_prefix}_total_pulses).publish_state(new_count);
              float total_m3 = id(${id_prefix}_offset_m3) + (new_count * (float) ${liters_per_pulse}) / 1000.0f;
              id(${id_prefix}_total_consumption).publish_state(total_m3);
    on_value:
      then:
        - lambda: |-
            // Flow Rate is derived from the same period-based measurement
            // as Pulse Rate - the two stay consistent with each other.
            id(${id_prefix}_flow_rate).publish_state(x * (float) ${liters_per_pulse});

  # Flow Rate - calibrated (liters_per_pulse-scaled) value, updated only
  # from Pulse Rate's on_value, no update schedule of its own.
  #
  # sorting_weight 20, after Total Consumption's 10: the dashboard's Home
  # page shows the lowest-weight entity of a meter's group as the big
  # "headline" number (see web/dashboard.js), and Total Consumption -
  # what's actually being billed - is the one that belongs there, not the
  # instantaneous rate.
  - platform: template
    id: ${id_prefix}_flow_rate
    name: "${friendly_name} Flow Rate"
    icon: "mdi:water-pump"
    unit_of_measurement: "L/min"
    accuracy_decimals: 3
    state_class: measurement
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 20

  # Total Consumption - the primary source for HA long-term statistics.
  # offset_m3 + pulse_count * liters_per_pulse / 1000.
  - platform: template
    id: ${id_prefix}_total_consumption
    name: "${friendly_name} Total Consumption"
    icon: "mdi:water"
    unit_of_measurement: "m³"
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 3
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 10

  # Total Pulses - diagnostic, raw readout of the persistent pulse_count.
  # Deliberately NO state_class: no need for HA long-term statistics on it
  # (that's what Total Consumption is for), and being checkpoint-based it
  # could jump backwards on power loss just like pulse_count itself.
  - platform: template
    id: ${id_prefix}_total_pulses
    name: "${friendly_name} Total Pulses"
    icon: "mdi:counter"
    unit_of_measurement: "pulses"
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 50

switch:
  # Dashboard-only visibility toggle (see web/dashboard.js) - flip off for
  # a meter that isn't physically installed on this deployment, to stop
  # its Home card cluttering the UI. Deliberately does NOT stop pulse
  # counting: there's no cost to leaving that running on an unconnected
  # GPIO, and "disabled but still pulsing anyway" would itself be worth
  # noticing, not something to hide. Also deliberately does NOT hide this
  # meter's other Service fields (Reading, Zero-Flow Timeout, Display
  # Name) anymore - they stay reachable/editable regardless, since
  # everything they control stays in effect either way, hidden from Home
  # or not; hiding them too just made an already-configured meter harder
  # to fix if it needed to come back.
  #
  # Named "Show on Dashboard" (not "Enabled") and sorted last in this
  # group - it's the least-used field day to day, purely a display
  # preference for this custom dashboard, with literally no effect
  # anywhere else (not on pulse counting, not in Home Assistant once
  # connected there - see disabled_by_default below).
  - platform: template
    id: ${id_prefix}_enabled
    name: "${friendly_name} Show on Dashboard"
    icon: "mdi:eye-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    disabled_by_default: true
    # optimistic:true alone would queue the flash write and leave it
    # pending for up to flash_write_interval (60s, water-collector.yaml) -
    # a toggle right before a crash/power loss in that window would be
    # lost. `on_state` is the base switch component's generic trigger,
    # fired from publish_state() *after* it has already saved the new
    # value to the (still just queued, not yet flashed) preference - so
    # by the time this lambda runs, sync() has something to actually
    # flush. (The template platform's own turn_on/off_action fire earlier,
    # before that save - confirmed from TemplateSwitch::write_state() -
    # so they'd be a no-op here; this is why `on_state`, not those.)
    on_state:
      - lambda: global_preferences->sync();
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 90

text:
  # Purely cosmetic label - shown on the dashboard's Home card and
  # Service section header instead of the fixed "${friendly_name}", so a
  # meter can be renamed per-installation (e.g. "Main Meter"/"Garden
  # Meter", or anything else) without touching the YAML. Starts out equal
  # to friendly_name (itself deliberately generic - "Water Meter 1/2",
  # not "Main"/"Garden") until renamed. The id_prefix/entity names/
  # sorting_group stay fixed at compile time either way - only what's
  # *displayed* changes.
  - platform: template
    id: ${id_prefix}_display_name
    name: "${friendly_name} Display Name"
    icon: "mdi:rename-box"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${friendly_name}"
    min_length: 0
    max_length: 32
    entity_category: config
    disabled_by_default: true
    # Same immediate-flush reasoning as the Show on Dashboard switch above - but
    # TemplateText::control() saves to the preference *after* firing
    # set_action (unlike the switch base class), so sync()ing straight
    # from set_action would flush too early and miss this exact change.
    # A trivial delay is enough: control() is a single synchronous call,
    # so by the time this resumes (a full scheduler tick later) the save
    # has long since happened.
    set_action:
      - delay: 10ms
      - lambda: global_preferences->sync();
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 6

number:
  # Physical meter reading entry (m3) - input only, does nothing by
  # itself; the "Update" button below reads it.
  #
  # Naming note: the object_id this name generates ("..._reading") and the
  # Update button's ("..._update") are matched by suffix in
  # web/dashboard.js to render the two as one combined field+button row
  # on the dashboard's Service page - keep both names' *_reading/*_update
  # endings if either is ever renamed.
  - platform: template
    id: ${id_prefix}_sync_target
    name: "${friendly_name} Reading"
    icon: "mdi:counter"
    unit_of_measurement: "m³"
    mode: box
    min_value: 0
    max_value: 100000
    step: 0.001
    optimistic: true
    initial_value: 0
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 60

  # Zero-flow timeout - runtime-adjustable, low-level parameter (see
  # REQUIREMENTS.md "Pillanatnyi átfolyás számítása"). restore_value: true
  # -> survives a restart too - and, same reasoning as Display Name above
  # (TemplateNumber::control() also saves *after* firing set_action), a
  # short delay before sync() forces that write to flash immediately
  # instead of leaving it queued for up to flash_write_interval.
  - platform: template
    id: ${id_prefix}_zero_flow_timeout
    name: "${friendly_name} Zero-Flow Timeout"
    icon: "mdi:timer-cog-outline"
    unit_of_measurement: "s"
    mode: box
    min_value: 10
    max_value: 600
    step: 1
    optimistic: true
    restore_value: true
    initial_value: ${zero_flow_timeout_default}
    entity_category: config
    disabled_by_default: true
    set_action:
      - delay: 10ms
      - lambda: global_preferences->sync();
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 70

button:
  # Apply manual sync: recompute offset_m3 so Total Consumption jumps
  # immediately to the given reading, without disturbing pulse_count (the
  # diagnostic pulse counter). Saves immediately, independent of the
  # checkpoint schedule.
  #
  # Named "Update" (not "Sync") and paired with the Reading field above by
  # object_id suffix - see the note there.
  - platform: template
    id: ${id_prefix}_sync_apply
    name: "${friendly_name} Update"
    icon: "mdi:sync"
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 80
    on_press:
      - lambda: |-
          float target = id(${id_prefix}_sync_target).state;
          float measured_m3 = (id(${id_prefix}_pulse_count) * (float) ${liters_per_pulse}) / 1000.0f;
          id(${id_prefix}_offset_m3) = target - measured_m3;
          // Own preference object, explicit save() + sync(): persists to
          // flash immediately in THIS call, independent of the globals:
          // restore_value polling cycle, on a single button press.
          //
          // static is load-bearing, not a style choice: make_preference()
          // heap-allocates a new backend object every time it's called
          // (confirmed from esp32/preferences.cpp - `new
          // ESP32PreferenceBackend()`, with no matching delete anywhere -
          // ESPPreferenceObject is a non-owning handle, designed be
          // created *once* in setup() and reused, which is exactly what
          // every built-in component - number/switch/text with
          // restore_value - does). Without `static` here, every single
          // Update press leaked one of these, permanently, for the rest
          // of the device's uptime - death by a thousand cuts on both
          // free heap and (worse) heap fragmentation, since a small
          // permanent allocation can block the allocator from ever
          // coalescing a large-enough contiguous block again. `static`
          // makes this call happen exactly once, ever, matching the
          // built-in components' own usage pattern.
          static auto pref = global_preferences->make_preference<float>(fnv1a_hash("${id_prefix}_offset_m3"));
          pref.save(&id(${id_prefix}_offset_m3));
          global_preferences->sync();
          id(${id_prefix}_total_consumption).publish_state(target);

interval:
  # Zero-flow watchdog: if no new pulse has arrived for `timeout` seconds,
  # Flow Rate (and, via the on_value chain, nothing else, since Pulse Rate
  # is the source) is explicitly set to 0. Only publishes when not already
  # 0, to avoid generating redundant, repeated states.
  - interval: 1s
    then:
      - lambda: |-
          if (id(${id_prefix}_pulse_rate).state != 0) {
            uint32_t timeout_ms = (uint32_t) (id(${id_prefix}_zero_flow_timeout).state * 1000);
            uint32_t elapsed_ms = millis() - id(${id_prefix}_last_pulse_ms);
            if (elapsed_ms > timeout_ms) {
              id(${id_prefix}_pulse_rate).publish_state(0);
            }
          }

esphome:
  on_boot:
    # Default priority: every component's setup() (including restore_value
    # globals being restored) has already run by this point.
    then:
      # Load offset_m3 from its own preference slot, BEFORE anything uses
      # it - same preference key as the "Update" button's save. If there
      # was never a manual sync, load() returns false and it stays at its
      # 0 initial_value.
      #
      # on_boot only runs once, so the leak explained next to the Update
      # button's own make_preference() call isn't really live here - but
      # `static` costs nothing and keeps both call sites consistent.
      - lambda: |-
          static auto pref = global_preferences->make_preference<float>(fnv1a_hash("${id_prefix}_offset_m3"));
          float loaded = 0;
          if (pref.load(&loaded)) {
            id(${id_prefix}_offset_m3) = loaded;
          }
      # Seed the pulse_meter's own "since boot" total with the persisted
      # pulse_count, so from now on the total: on_value gives the
      # absolute (not just "since boot") pulse count.
      - pulse_meter.set_total_pulses:
          id: ${id_prefix}_pulse_rate
          value: !lambda 'return id(${id_prefix}_pulse_count);'
      # The set_total_pulses call above also publishes the `total:`
      # sub-sensor, which synchronously runs the on_value chain further up
      # - Total Pulses, Total Consumption and last_pulse_ms are already
      # updated there (pulse_count onto itself, a no-op). All that's left
      # here is explicitly zeroing Pulse Rate at startup, which cascades
      # to Flow Rate via its own on_value - so there's no duplicated logic
      # anywhere.
      - lambda: |-
          id(${id_prefix}_pulse_rate).publish_state(0);
