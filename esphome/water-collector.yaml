# Water Data Collector - pulse-counter data acquisition unit.
# This device collects raw measurements only; Home Assistant owns
# historization, statistics and presentation. See REQUIREMENTS.md
# (Hungarian) at the repo root for the full spec.
#
# Initial testing: `board_type`/`meter1_pulse_pin`/`meter2_pulse_pin` are
# set to an older, non-S3 ESP32 devkit (see below). Once the production
# hardware arrives (Waveshare ESP32-S3-RS485-CAN,
# docs/hardver/esp32-s3-rs485-can-board.md), flip the commented-out
# substitutions: board_type -> esp32-s3-devkitc-1, pulse pins -> GPIO1 /
# GPIO2.

substitutions:
  device_name: water-collector
  friendly_device_name: "Water Data Collector"

  # --- Hardware: test phase (non-S3 board) ---
  board_type: esp32dev
  meter1_pulse_pin: GPIO32
  meter2_pulse_pin: GPIO33

  # --- Hardware: production (Waveshare ESP32-S3-RS485-CAN) ---
  # board_type: esp32-s3-devkitc-1
  # meter1_pulse_pin: GPIO1
  # meter2_pulse_pin: GPIO2

esphome:
  name: ${device_name}
  friendly_name: ${friendly_device_name}
  comment: "Water supply data collector - pulse counters (+ pressure sensors planned)"

esp32:
  board: ${board_type}
  framework:
    type: esp-idf
    # Paired with the raised httpd max_open_sockets in the local
    # web_server_idf override below (components/web_server_idf/
    # web_server_idf.cpp) - that value can't actually be used if the
    # system-wide LWIP socket pool doesn't have room for it too. ESPHome
    # auto-sizes this from each component's own declared socket needs, but
    # has no visibility into a value hardcoded directly in our forked .cpp
    # (it's not exposed through Python config), so it has to be set
    # explicitly here instead of trusting the auto-calc. Comfortably above
    # web_server_idf's own new max_open_sockets (12) plus headroom for the
    # native api: connection, mDNS, and OTA - cheap relative to the ~100KB
    # free heap this device normally runs with.
    sdkconfig_options:
      CONFIG_LWIP_MAX_SOCKETS: "20"

# Local override of ESPHome's built-in web_server_idf component (components/web_server_idf/,
# a full copy of the upstream 2026.7.3 source with one fix applied) - works around a genuine,
# confirmed use-after-free in web_server_idf.cpp still present upstream as of 2026.7.3 and the
# current esphome/esphome main branch as of 2026-08-10.
#
# Root cause, confirmed by decoding a real crash's backtrace (xtensa-esp32-elf-addr2line
# against the build's own .elf) and reading the actual upstream source:
#   - process_buffer_()'s "stuck EventSource connection" path (fires after ~20s of failed
#     sends - the same symptom power_save_mode: none above was meant to reduce, but doesn't
#     eliminate outright, e.g. a client that goes to sleep/loses network without a clean TCP
#     close can still trigger it) used to call `this->fd_.store(0)` directly.
#   - That makes the very next main-loop tick `delete` the C++ session object - but the
#     underlying httpd session (req->sess_ctx) still points at it, and httpd hasn't actually
#     closed the socket yet.
#   - When httpd later retires that socket for real (its own idle/error handling), it invokes
#     free_ctx (destroy()) on what is by then a dangling pointer - a use-after-free write into
#     already-freed/reused heap memory.
#   - That corruption gets detected later, elsewhere, by an unrelated free() - which is
#     exactly what was observed: `assert failed: block_merge_prev ... "prev block is not free
#     though marked as such"` inside lwIP's own tcpip_thread housekeeping (sys_check_timeouts
#     -> memp_free), a few seconds after a "Closing stuck EventSource connection" log line and
#     the fd's own (already-dangling) "Event source connection closed" log line.
#
# Fix applied in components/web_server_idf/web_server_idf.cpp: that path now only calls the
# proper ESP-IDF API, httpd_sess_trigger_close(), and leaves fd_/deletion to the same safe
# close_fn -> free_ctx path a normal client-initiated disconnect already goes through -
# instead of racing ahead of httpd itself. See the comment at the call site for the full
# writeup. Not yet reported upstream.
#
# If/when this is fixed in a released ESPHome version, this whole external_components block
# (and the components/web_server_idf/ copy) can be deleted again - it's a temporary override,
# not a fork to maintain long-term.
external_components:
  - source:
      type: local
      path: components
    components: [web_server_idf]

# Checkpoint mechanism: every restore_value: true global/number persists
# through this. flash_write_interval already defaults to 60s, spelled out
# explicitly here to keep it traceable against REQUIREMENTS.md.
preferences:
  flash_write_interval: 60s

logger:

api:
  encryption:
    key: !secret api_encryption_key
  # Default (15min, not the 5min the C++ member default alone would
  # suggest - confirmed from api/__init__.py's schema) is: reboot if no
  # *native API* client (HA, `esphome logs`, ...) has connected in that
  # window. That's the right safety net once HA is actually the ongoing
  # primary client - but nothing currently connects over this protocol
  # at all (the custom web dashboard talks plain HTTP/SSE on port 80, a
  # completely different thing) - which meant the device was rebooting
  # itself, unconditionally, every 15 minutes, regardless of whether
  # anything was actually wrong. Disabled for now; once HA is connected
  # and stays connected, this would rarely if ever fire anyway (the
  # countdown resets on every connection), so there's nothing to
  # remember to revert later.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

# Backs the "Free Heap" diagnostic sensor below.
debug:

web_server:
  version: 3
  # IMPORTANT: do NOT set `local: true` here. With `local: true` ESPHome
  # serves a fixed, pre-built index.html (baked into the esphome pip
  # package at release time) that never references css_include/js_include
  # at all - our dashboard would compile in fine but never actually load
  # in the browser. css_include/js_include only get wired into the page
  # (<link href=/0.css>, <script type=module src=/0.js>) in the
  # *dynamically generated* index.html, which is what's used when `local`
  # is left at its default (false). See build_index_html() in
  # esphome/components/web_server/__init__.py if this ever needs
  # re-verifying against a newer ESPHome version.
  #
  # That dynamic index.html would otherwise also add a
  # <script src="https://oi.esphome.io/v3/www.js"> for the stock app -
  # blanking js_url removes that tag entirely (falsy value == the
  # generator skips it), so there's still no network dependency. css_url
  # already defaults to empty for version 3.
  js_url: ""
  css_url: ""
  # Our own dark, section-per-page dashboard (web/dashboard.{css,js}) - see
  # the files themselves for how/why. Hides the stock <esp-app> UI and
  # replaces it client-side; still uses ESPHome's normal REST/SSE API
  # underneath, so nothing else here changes.
  css_include: web/dashboard.css
  js_include: web/dashboard.js
  # No `auth:` - deliberate, see REQUIREMENTS.md "Hálózat és biztonság".
  # This is a local-network-only dashboard, meant to also work as an iOS
  # home-screen app; a login screen would only be friction, not a real
  # security boundary (anyone already on the home Wi-Fi reaches it either
  # way). api_encryption_key/ota_password (below) stay secret - those
  # protect the native API and firmware flashing, unrelated to this.
  sorting_groups:
    # Names deliberately generic ("Water Meter 1/2", not "Main"/"Garden") -
    # which physical meter is which is a fact about *this* installation,
    # not something to bake into the firmware. Rename via each meter's own
    # "Display Name" field on the Service page instead - see the note next
    # to friendly_name below.
    - id: sorting_group_meter1
      name: "Water Meter 1"
      sorting_weight: 10
    - id: sorting_group_meter2
      name: "Water Meter 2"
      sorting_weight: 20
    # Reserved for the planned pressure sensors (x3) - uncomment and wire
    # up their sorting_group_id once that hardware exists.
    # - id: sorting_group_pressure
    #   name: "Pressure Sensors"
    #   sorting_weight: 30
    - id: sorting_group_network
      name: "Network"
      sorting_weight: 80
    - id: sorting_group_system
      name: "System"
      sorting_weight: 90

# Wi-Fi credentials are deliberately absent here (see REQUIREMENTS.md
# "Hálózat és biztonság"): the device boots with none configured, and gets
# them only at runtime, via BLE (esp32_improv below) or this AP + captive
# portal. Whatever is entered there is saved to the ESP's own flash, not
# to this build.
wifi:
  ap:
    ssid: "${friendly_device_name} Setup"
  # ESPHome's own default on ESP32 is "light" (modem-sleep power saving) -
  # a well-documented source of exactly the symptom seen on real hardware
  # (dashboard/ping unreachable for many seconds while the device is
  # still alive and logging over serial, web_server_idf logging "Closing
  # stuck EventSource connection after 2500 failed sends" - an ~20s
  # continuous inability to get a single TCP send out). Trades a small
  # amount of extra power draw (irrelevant - this device is always
  # mains/USB powered) for the radio never dropping into a sleep state
  # that can stall an in-progress send.
  power_save_mode: none
  # Real-device symptom: once actually connected, ping to this device shows
  # wide, erratic RTT swings (double-digit ms up to >1s, occasional outright
  # timeouts) with *zero* corresponding wifi:-component log activity (no
  # roam scan, no disconnect/reassociate) - i.e. this isn't a connection
  # drop, it's happening below the level ESPHome's own Wi-Fi state machine
  # would ever log anything about.
  #
  # Leading suspect: the ESP32 has a single 2.4GHz radio, time-shared
  # between Wi-Fi and Bluetooth (BLE) via coexistence scheduling - and
  # esp32_improv (below) leaves BLE running for the device's entire uptime,
  # not just while unprovisioned, permanently competing with Wi-Fi for
  # radio time. BLE is only actually needed while there's no working Wi-Fi
  # connection to provision it over - once connected, it's pure overhead.
  # Confirmed from source (esp32_ble/ble.cpp) that ble.disable/ble.enable
  # actually tear down/reinit the BLE stack (not just stop advertising),
  # and that esp32_improv's own stop() (called automatically once Wi-Fi
  # connects - see esp32_improv_component.cpp's check_wifi_connection_())
  # only stops its own GATT service, never the underlying BLE stack -
  # explaining why BLE was confirmed still active (BLE Client connected
  # seen in a real log) long after Wi-Fi provisioning was already done.
  #
  # Wired symmetrically so the BLE-based recovery path (fallback AP +
  # esp32_improv, for if Wi-Fi credentials ever need to change again) stays
  # fully intact: BLE only goes away while there's a working Wi-Fi
  # connection to make it redundant, and comes back the instant that's no
  # longer true.
  #
  # Flagged honestly: this is a plausible, source-supported hypothesis for
  # the jitter, not a confirmed root cause - there's no way to prove BLE
  # coexistence specifically (versus e.g. general 2.4GHz channel
  # congestion) was the cause without comparing ping behavior before/after
  # on the real device.
  on_connect:
    - ble.disable
  on_disconnect:
    - ble.enable

captive_portal:

esp32_improv:
  authorizer: none

sensor:
  # entity_category: diagnostic on everything below - it's what routes
  # these onto the dashboard's "Diagnostics" page (see web/dashboard.js:
  # pageFor()) instead of the primary "Home" page, which is reserved for
  # the meters' own readings.
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: sorting_group_network
      sorting_weight: 10

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    web_server:
      sorting_group_id: sorting_group_system
      sorting_weight: 10

  - platform: internal_temperature
    name: "Unit Temperature"
    entity_category: diagnostic
    web_server:
      sorting_group_id: sorting_group_system
      sorting_weight: 20

  - platform: debug
    free:
      name: "Free Heap"
      entity_category: diagnostic
      web_server:
        sorting_group_id: sorting_group_system
        sorting_weight: 30

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
      web_server:
        sorting_group_id: sorting_group_network
        sorting_weight: 20
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic
      web_server:
        sorting_group_id: sorting_group_network
        sorting_weight: 30

  - platform: version
    name: "Firmware Version"
    entity_category: diagnostic
    web_server:
      sorting_group_id: sorting_group_system
      sorting_weight: 40

  - platform: debug
    device:
      name: "Reset Reason"
      entity_category: diagnostic
      web_server:
        sorting_group_id: sorting_group_system
        sorting_weight: 50

button:
  # entity_category: config -> dashboard "Service" page, alongside the
  # meters' own Update buttons (a device-level action still belongs there,
  # not on Diagnostics, which is read-only info).
  - platform: restart
    name: "Restart"
    entity_category: config
    web_server:
      sorting_group_id: sorting_group_system
      sorting_weight: 90

  # Wipes ALL settings (Wi-Fi included, not just Wi-Fi) and reboots into
  # provisioning mode. There is no ESPHome-native "forget Wi-Fi only"
  # action; this is the closest equivalent to "switch to a different
  # hotspot", at the cost of also clearing the other saved preferences
  # (calibration offsets, zero-flow timeouts) - a rare, deliberate action.
  #
  # Deliberately left off the custom web UI entirely (dashboard.js skips
  # any button named "Factory Reset..." outright, not just a confirm
  # dialog) - stays reachable through the Home Assistant API/entity if
  # ever needed there, just not one accidental tap away on the device's
  # own page.
  - platform: factory_reset
    name: "Factory Reset (incl. Wi-Fi)"
    web_server:
      sorting_group_id: sorting_group_system
      sorting_weight: 91

packages:
  # friendly_name is deliberately generic ("Water Meter 1/2", not "Main"/
  # "Garden") - which physical meter is which is a fact about *this*
  # installation, not the firmware; it drives both the compiled-in entity
  # names (e.g. "Water Meter 1 Reading") and the "Display Name" field's
  # starting value, which is what you'd actually rename on the Service
  # page ("Main Meter"/"Garden Meter", or whatever fits) without needing
  # a recompile. id_prefix (meter1/meter2 below), same reasoning - purely
  # internal, never shown anywhere. Changing an *existing*, already-
  # calibrated meter's id_prefix later would still reset its saved
  # calibration though (it's part of the flash preference key for
  # offset_m3 - see water_meter.yaml) - a non-issue this early on, before
  # anything's built on top of these entities (no HA setup yet), but not
  # a free rename anymore once that's no longer true.
  meter1: !include
    file: packages/water_meter.yaml
    vars:
      id_prefix: meter1
      friendly_name: "Water Meter 1"
      pulse_pin: ${meter1_pulse_pin}
      liters_per_pulse: "1.0"
      zero_flow_timeout_default: "60"
      sorting_group_id: sorting_group_meter1

  meter2: !include
    file: packages/water_meter.yaml
    vars:
      id_prefix: meter2
      friendly_name: "Water Meter 2"
      pulse_pin: ${meter2_pulse_pin}
      liters_per_pulse: "1.0"
      zero_flow_timeout_default: "60"
      sorting_group_id: sorting_group_meter2
