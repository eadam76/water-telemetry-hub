<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .box { fill: rgba(148,163,184,0.10); stroke: #94a3b8; stroke-width: 1.5; }
    .title { fill: #64748b; font-weight: 700; font-size: 13px; text-anchor: middle; }
    .sub { fill: #64748b; font-size: 10.5px; text-anchor: middle; }
    .note { fill: #94a3b8; font-size: 8.5px; font-style: italic; text-anchor: middle; }
    .pin { fill: #64748b; font-size: 10.5px; }
    .wire { fill: none; stroke-width: 2; }
    .sig { stroke: #e8a33d; }
    .gnd { stroke: #94a3b8; stroke-dasharray: 4 3; }
    .a { stroke: #4d94e8; }
    .b { stroke: #43b581; }
    .pwr { stroke: #d64550; }
    .dot { fill: currentColor; }
    .legend { font-size: 10.5px; fill: #64748b; }
    .caption { font-size: 10px; fill: #94a3b8; }
  </style>

  <!-- ESP32-S3-RS485-CAN controller -->
  <rect class="box" x="30" y="250" width="190" height="180" rx="12"/>
  <text class="title" x="125" y="285">ESP32-S3-RS485-CAN</text>
  <text class="sub" x="125" y="303">Waveshare · main controller</text>
  <circle class="dot" cx="220" cy="290" r="3" style="color:#e8a33d"/>
  <line class="wire sig" x1="220" y1="290" x2="248" y2="290"/>
  <text class="pin" x="226" y="323" style="fill:#e8a33d">GPIO1</text>
  <circle class="dot" cx="220" cy="318" r="3" style="color:#e8a33d"/>
  <line class="wire sig" x1="220" y1="318" x2="248" y2="318"/>
  <text class="pin" x="226" y="313" style="fill:#e8a33d">GPIO2</text>
  <circle class="dot" cx="220" cy="346" r="3" style="color:#94a3b8"/>
  <line class="wire gnd" x1="220" y1="346" x2="248" y2="346"/>
  <text class="pin" x="226" y="342" style="fill:#94a3b8">GND</text>
  <circle class="dot" cx="220" cy="374" r="3" style="color:#4d94e8"/>
  <line class="wire a" x1="220" y1="374" x2="248" y2="374"/>
  <text class="pin" x="226" y="370" style="fill:#4d94e8">A (485+)</text>
  <circle class="dot" cx="220" cy="402" r="3" style="color:#43b581"/>
  <line class="wire b" x1="220" y1="402" x2="248" y2="402"/>
  <text class="pin" x="226" y="398" style="fill:#43b581">B (485-)</text>

  <!-- Pulse Meter 1 -->
  <rect class="box" x="480" y="40" width="230" height="110" rx="10"/>
  <text class="title" x="595" y="72">IZAR PULSE i</text>
  <text class="sub" x="595" y="90">Pulse Meter 1 · GPIO1</text>
  <text class="note" x="595" y="108">open-collector output + GND</text>
  <circle class="dot" cx="480" cy="70" r="3" style="color:#e8a33d"/>
  <circle class="dot" cx="480" cy="95" r="3" style="color:#94a3b8"/>

  <!-- Pulse Meter 2 -->
  <rect class="box" x="480" y="190" width="230" height="110" rx="10"/>
  <text class="title" x="595" y="222">IZAR PULSE i</text>
  <text class="sub" x="595" y="240">Pulse Meter 2 · GPIO2</text>
  <text class="note" x="595" y="258">open-collector output + GND</text>
  <circle class="dot" cx="480" cy="220" r="3" style="color:#e8a33d"/>
  <circle class="dot" cx="480" cy="245" r="3" style="color:#94a3b8"/>

  <!-- signal + gnd wiring for pulse meters -->
  <polyline class="wire sig" points="248,290 330,290 330,70 480,70"/>
  <polyline class="wire sig" points="248,318 360,318 360,220 480,220"/>
  <line class="wire gnd" x1="400" y1="95" x2="480" y2="95"/>
  <line class="wire gnd" x1="400" y1="245" x2="480" y2="245"/>
  <line class="wire gnd" x1="400" y1="95" x2="400" y2="346"/>
  <line class="wire gnd" x1="248" y1="346" x2="400" y2="346"/>

  <!-- RS485 bus trunk -->
  <polyline class="wire a" points="248,374 300,374 300,480"/>
  <polyline class="wire b" points="248,402 320,402 320,500"/>
  <line class="wire a" x1="300" y1="480" x2="850" y2="480"/>
  <line class="wire b" x1="320" y1="500" x2="850" y2="500"/>
  <circle class="dot" cx="300" cy="480" r="3" style="color:#4d94e8"/>
  <circle class="dot" cx="320" cy="500" r="3" style="color:#43b581"/>
  <text class="caption" x="330" y="465">RS485 bus (daisy-chain) · 9600 8N1</text>

  <!-- Pressure sensor -->
  <rect class="box" x="700" y="300" width="250" height="120" rx="10"/>
  <text class="title" x="825" y="335">QDW90A</text>
  <text class="sub" x="825" y="353">Pressure Sensor · addr 5</text>
  <text class="note" x="825" y="371">0–10 bar, 24V DC</text>
  <line class="wire a" x1="790" y1="420" x2="790" y2="480"/>
  <line class="wire b" x1="830" y1="420" x2="830" y2="500"/>
  <circle class="dot" cx="790" cy="480" r="3" style="color:#4d94e8"/>
  <circle class="dot" cx="830" cy="500" r="3" style="color:#43b581"/>
  <circle class="dot" cx="790" cy="420" r="3" style="color:#4d94e8"/>
  <circle class="dot" cx="830" cy="420" r="3" style="color:#43b581"/>

  <!-- Flow meter -->
  <rect class="box" x="700" y="560" width="250" height="120" rx="10"/>
  <text class="title" x="825" y="595">T3-1-2-H</text>
  <text class="sub" x="825" y="613">Flow Meter · addr 3</text>
  <text class="note" x="825" y="631">DN20, ultrasonic</text>
  <line class="wire a" x1="790" y1="560" x2="790" y2="480"/>
  <line class="wire b" x1="830" y1="560" x2="830" y2="500"/>
  <circle class="dot" cx="790" cy="560" r="3" style="color:#4d94e8"/>
  <circle class="dot" cx="830" cy="560" r="3" style="color:#43b581"/>

  <!-- power -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d64550"/>
    </marker>
  </defs>
  <text class="sub" x="900" y="245" style="fill:#d64550">24V DC</text>
  <line class="wire pwr" x1="900" y1="255" x2="900" y2="297" marker-end="url(#arrow)"/>
  <circle class="dot" cx="900" cy="300" r="3" style="color:#d64550"/>
  <line class="wire pwr" x1="900" y1="722" x2="900" y2="683" marker-end="url(#arrow)"/>
  <circle class="dot" cx="900" cy="680" r="3" style="color:#d64550"/>
  <text class="sub" x="900" y="737" style="fill:#d64550">8–36V DC</text>

  <!-- legend -->
  <g transform="translate(30,760)">
    <line class="wire sig" x1="0" y1="0" x2="26" y2="0"/><text class="legend" x="32" y="4">Pulse signal</text>
    <line class="wire gnd" x1="150" y1="0" x2="176" y2="0"/><text class="legend" x="182" y="4">GND</text>
    <line class="wire a" x1="250" y1="0" x2="276" y2="0"/><text class="legend" x="282" y="4">RS485 A</text>
    <line class="wire b" x1="380" y1="0" x2="406" y2="0"/><text class="legend" x="412" y="4">RS485 B</text>
    <line class="wire pwr" x1="510" y1="0" x2="536" y2="0"/><text class="legend" x="542" y="4">DC power</text>
  </g>
</svg>
