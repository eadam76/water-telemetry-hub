# Optional MQTT integration package - 2026-08-15.
#
# Why this exists as a separate, opt-in package instead of living inline in
# water-collector.yaml (direct feedback: "Induláskor miért fosta tele a
# logot mqtt sorokkal? Nem is kéne alapból mqtt-vel foglalkoznia." - why did
# the log fill up with MQTT lines on startup, it shouldn't deal with MQTT by
# default at all): confirmed via a real device boot log the user attached
# that merely having a top-level `mqtt:` block configured AT ALL - regardless
# of `discovery:`/`enable_on_boot:` settings - makes ESPHome statically
# allocate one MQTTSensorComponent/MQTTSwitchComponent/MQTTTextComponent/etc.
# wrapper PER ENTITY in the whole project (106 of them here), and EVERY one
# of those wrappers logs 2-3 [C]-level lines during dump_config() on EVERY
# boot - ~200+ lines of pure MQTT noise before anything actually useful gets
# logged, confirmed directly in that log (lines ~446-695 of it), enough to
# consume most of log_ring_buffer's 16kB budget on boot alone, and unrelated
# to whether MQTT is even in use.
#
# Splitting all of it into this package means anyone who doesn't want MQTT
# gets none of that cost, simply by commenting out (or deleting) the single
# `mqtt: !include packages/mqtt.yaml` line in water-collector.yaml's own
# `packages:` section - no other edits needed anywhere else in the project.
#
# Follow-up, 2026-08-16, direct feedback on a second boot log showing the
# same spam even with this package still included (expected, since it was
# still included by default - not a bug on its own): "nem is kéne
# futásidőben ezekkel foglalkoznia, ha mqtt enabled" (it shouldn't be
# dealing with these at runtime unless MQTT is enabled) - worth being
# precise about what's actually true here, since it's easy to conflate two
# different things. The `[C]`-level dump_config() lines below are NOT a
# runtime "is MQTT active" check - EVERY ESPHome component logs its own
# static configuration exactly once during setup(), unconditionally,
# purely because it was compiled in, regardless of any runtime toggle
# (our own "MQTT Enabled" switch is a pure dashboard/YAML concept the C++
# component itself has no notion of). That part is standard ESPHome
# behavior, not a bug, and not something a YAML-level "if enabled" could
# gate - the code that logs it doesn't know about our switch at all.
# What IS fixable, and done here: the `logger: logs:` map below lowers
# these specific MQTT wrapper tags' own log level to WARN, so their
# CONFIG-level dump_config() spam is filtered out at the source (the
# logging macro itself checks the tag's level before ever building/
# emitting the line - this isn't just hiding it from one output, nothing
# gets logged at all), while genuine `[W]`/`[E]` runtime problems (e.g. an
# actual broker connection failure) still show, since those are at or
# above the WARN threshold. This keeps MQTT itself fully usable - unlike
# commenting out the `packages:` include above, which removes the feature
# entirely - it only silences the one-time boot-config printout.
#
# Everything below is otherwise unchanged from its previous inline form -
# see each entity's own comment for the fuller design reasoning (runtime
# broker/credentials via MQTTClientComponent's public API, no separate Port
# field, the mode: password server-side masking bug and its client-side
# fix, the mqtt_want_connected reconnect-on-boot semantics, etc.) The
# meaningful move here is purely mechanical: these keys get concatenated
# into water-collector.yaml's own top-level esphome:/globals:/web_server:/
# mqtt:/switch:/button:/text:/text_sensor: keys by ESPHome's own packages:
# merge behavior (list-valued keys are concatenated across the main file and
# any included packages), so nothing else in the project needs to know this
# file exists.

esphome:
  includes:
    - include/mqtt_broker_url.h
  # MQTT reconnect-on-boot: "reboot után automatikusan kell kapcsolódnia
  # ha már egyszer connectált. Ha disconnectáltunk kézzel akkor reboot
  # után se connectáljon" (should reconnect automatically after a reboot
  # if it was ever connected; if manually disconnected, it shouldn't
  # reconnect after a reboot either) - gated on mqtt_want_connected
  # (globals: above), NOT directly on either switch's own restored state
  # - "MQTT Connect"'s own turn_on_action sets it true, turn_off_action
  # sets it false (switch: section below - "MQTT Enabled" doesn't touch
  # this flag at all anymore, see its own comment for why). priority: 200
  # (AFTER_WIFI, esphome/core/component.h's own setup_priority table) -
  # deliberately after
  # wifi:'s own setup (250), not before: MQTT client auth needs actual
  # Wi-Fi first.
  on_boot:
    priority: 200
    then:
      - text_sensor.template.publish:
          id: mqtt_status_text
          state: "Disabled"
      - lambda: |-
          if (!id(mqtt_password_stored).state.empty()) {
            id(mqtt_password_text).publish_state("••••••••");
          }
          // Belt-and-suspenders default for "MQTT Topic Prefix" - direct
          // feedback, 2026-08-15: confirmed filled with something, not
          // left to only a hint, on every boot regardless of exactly how
          // restore_value+initial_value interact for a never-before-seen
          // preference key.
          if (id(mqtt_topic_prefix_text).state.empty()) {
            id(mqtt_topic_prefix_text).publish_state("${device_name}");
          }
      # The actual reconnect-if-wanted trigger used to live here too, but
      # moved to wifi: on_connect: below, 2026-08-16 - see that key's own
      # comment for why (a real crash on cold boot, root-caused to firing
      # this before Wi-Fi/the network stack was actually ready).

# Reconnect-if-wanted, moved here from esphome: on_boot: - 2026-08-16,
# root-caused a real device crash (a user-attached log: repeated
# `assert failed: xQueueGenericSend queue.c:936 (pxQueue)` immediately
# after boot, on every one of 10 attempts, until ESPHome's own safe_mode
# boot-loop guard kicked in and stopped it). esphome: on_boot: (priority
# 200, "AFTER_WIFI" only in the sense of ESPHome's own component-setup
# ordering, confirmed by re-reading esphome/core/component.h) fires once
# every component's own setup() has run - NOT once Wi-Fi has actually
# associated and the network stack (LWIP, DNS) is genuinely ready, which
# in the crashing log's own timeline only happens several seconds LATER
# ("Connecting to 'IOT-AKN'" appears well after every one of the crash
# cycles, never before). Starting the MQTT client's own connection
# attempt (id(mqtt_id).enable(), inside "MQTT Connect"'s turn_on_action
# below) that early - before the network stack the ESP-IDF MQTT client
# depends on is actually up - is the most plausible trigger for a queue-
# level crash this low-level. wifi: on_connect: is the correct hook
# instead: it only ever fires once Wi-Fi has genuinely connected (a real
# IP obtained), so by the time this runs the network stack is
# unconditionally ready - and it re-fires on every later reconnect too
# (e.g. after a real Wi-Fi drop), which is a genuine improvement over the
# old boot-only trigger, not just a workaround: a dropped-and-recovered
# Wi-Fi link likely broke the MQTT session too, so re-applying "should
# reconnect" here (mqtt_id.enable() is safe to call repeatedly, see
# "MQTT Connect"'s own turn_on_action comment for the disable()-first
# fix that makes that true) now recovers MQTT automatically from that
# too, which the boot-only version never did.
wifi:
  on_connect:
    - if:
        condition:
          lambda: 'return id(mqtt_want_connected);'
        then:
          - switch.turn_on: mqtt_enabled_switch
          - switch.turn_on: mqtt_connect_switch

globals:
  # Whether MQTT should reconnect automatically on the NEXT boot - direct
  # feedback: "reboot után automatikusan kell kapcsolódnia ha már egyszer
  # connectált. Ha disconnectáltunk kézzel akkor reboot után se
  # connectáljon" (should reconnect automatically after a reboot if it
  # was ever connected; if manually disconnected, it shouldn't reconnect
  # after a reboot either). A separate, dedicated, `restore_value: true`
  # flag rather than just reading "MQTT Connect"'s own restored switch
  # state directly - set true/false by that switch's own turn_on_action/
  # turn_off_action (switch: section below), so it survives a reboot the
  # same way (that switch's own restore_mode is RESTORE_DEFAULT_OFF,
  # which wouldn't by itself distinguish "was on, should resume" from
  # "starting fresh").
  - id: mqtt_want_connected
    type: bool
    restore_value: true
    initial_value: "false"

web_server:
  sorting_groups:
    # MQTT settings (2026-08-15, direct feedback: "MQTT integration
    # possibility... enabled/disabled from the interface, parameters like
    # username/password, MQTT server, token, etc.") - its own group,
    # after "System", rather than folded into it: distinct enough (a
    # whole settings sub-form, not a single action/readout) to read
    # better with its own heading. See web/dashboard.js's own
    # `entity.groupName === "MQTT"` special-case for why this still
    # renders on the "System" page despite not being sorting_group_system
    # itself - grouping (this heading) and page placement (System vs.
    # Devices) are two independent things in this dashboard.
    # Weight 85 - between "Network" (80) and "System" (90), direct
    # feedback, 2026-08-16 ("az egész elrendezése: network és system közé
    # ékeljük be" - the whole thing should be wedged between Network and
    # System). Was 100 (after System) before this.
    - id: sorting_group_mqtt
      name: "MQTT"
      sorting_weight: 85

# Runtime-configurable MQTT, 2026-08-15 direct feedback ("MQTT integráció
# lehetősége... enabled/disabled a felületen, paraméterek megadva"). Unlike
# Wi-Fi's own save_wifi_sta()-style runtime reconfiguration, ESPHome's mqtt:
# component's connection settings (broker/port/username/password) DO have a
# full public runtime API (MQTTClientComponent::set_broker_address()/
# set_broker_port()/set_username()/set_password()/enable()/disable() - all
# public, confirmed against the installed esphome package's own
# mqtt_client.h) - no fork needed here, unlike web_server_idf's bug-fix fork.
#
# broker: is a required field even though it's meaningless until the
# dashboard sets a real one - enable_on_boot: false is what actually
# matters, so this placeholder is never connected to. The real broker/
# username/password/topic prefix always come from the persisted text:
# entities below, applied by "MQTT Enabled"'s own turn_on_action (see
# switch: below) - editing water-collector.yaml is never required to use
# MQTT, exactly as asked. There's no separate Port field (2026-08-15,
# direct feedback) - a single "MQTT Broker" field accepts an optional
# ":port" (or "scheme://host:port") itself, parsed by
# include/mqtt_broker_url.h.
#
# discovery: false - checked the actual generated C++ (`esphome compile`,
# up through source generation - see REQUIREMENTS.md's own MQTT section
# for why an actual xtensa build isn't possible in this sandbox) rather
# than assuming, and found something worth flagging: merely having mqtt:
# configured at all - regardless of this discovery: setting, confirmed by
# testing both values - statically allocates one MQTTSensorComponent/
# MQTTSwitchComponent/etc. PER ENTITY in this project (106 of them,
# counted from the generated `new(mqtt_...)` calls; disabling discovery
# only suppresses the HA auto-config topic, it does NOT remove these
# wrapper objects - ESPHome adds a hidden mqtt_id field to every entity's
# own schema the moment mqtt: exists anywhere in the YAML, unconditionally).
# That RAM/flash cost - AND the ~200-line dump_config() boot log spam it
# also causes (see this file's own header comment) - is simply the price
# of having MQTT at all, which is exactly why it now lives in this
# separate, opt-in package instead of always being built in.
# discovery: false itself is still the right default though, for a
# different, more important reason: this project's Home Assistant
# integration already has its own, established path (the native `api:`
# in water-collector.yaml, see REQUIREMENTS.md "Home Assistant adatmodell")
# - if HA were ALSO pointed at whatever broker this connects to, MQTT
# discovery would register a second, duplicate copy of every entity in HA.
# Flip to true only if MQTT-based discovery is actually wanted as well/
# instead.
mqtt:
  id: mqtt_id
  broker: "0.0.0.0"
  enable_on_boot: false
  discovery: false
  on_connect:
    - text_sensor.template.publish:
        id: mqtt_status_text
        state: "Connected"
  # Distinguishes a normal, expected disconnect from a genuine failed
  # connection attempt - direct feedback, 2026-08-16: "reloadra
  # disconnected jó állapot csak hibás csatlakozás után nem a disconnected
  # kell hanem a hiba olvasható magyarázata" (on reload "Disconnected" is
  # a fine state, but after a failed connection it shouldn't say
  # "Disconnected", it should say a readable explanation of the error).
  # Checks mqtt_connect_switch specifically, not mqtt_enabled_switch - the
  # latter is now just the components-visibility gate, the former is the
  # one that actually tracks "do we want to be connected right now"; it's
  # already off by the time this fires for an explicit Disconnect/Disable
  # (that switch's own turn_off_action publishes "Disconnected"/"Disabled"
  # first), so this branch only runs for a genuine, unwanted drop.
  #
  # REVISED 2026-08-16 (same-day follow-up, direct feedback): "Meg se
  # adtam adatokat majd azt mondja 'Connection lost - check broker/port/
  # credentials' - elég lenne csak connection error" (I hadn't even
  # entered any data and it said "Connection lost..." - just "Connection
  # error" would be enough). Two things changed: (1) shorter, plainer
  # default text ("Connection error", not implying a session existed to
  # "lose" when it may have never connected at all); (2) this trigger
  # actually DOES receive a real, typed disconnect reason as `x`
  # (MQTTClientDisconnectReason - MQTTDisconnectTrigger's own Trigger<>
  # type, confirmed in the installed esphome package's mqtt_client.h) -
  # the earlier comment here claiming ESPHome "can't tell us anything
  # more specific" was WRONG in one case: DNS resolution failures are
  # caught by MQTTClientComponent's own generic check_dnslookup_()
  # (backend-independent, confirmed in mqtt_client.cpp), which correctly
  # reports DNS_RESOLVE_ERROR through this same `x` - exactly the case an
  # empty/unresolvable "MQTT Broker" field hits, confirmed against a real
  # device log the user attached (`Couldn't resolve IP address for ''`).
  # The ESP32/IDF backend's own actual TCP-level MQTT_EVENT_DISCONNECTED
  # handler still only ever reports the generic TCP_DISCONNECTED for
  # everything else (confirmed in mqtt_backend_esp32.cpp, plus its own
  # `// TODO is there a way to get the disconnect reason?"), so this
  # still can't surface e.g. "wrong password" specifically without
  # forking that file - not attempted here, per the project's own "only
  # fork when there's no other way" pattern.
  on_disconnect:
    - lambda: |-
        if (!id(mqtt_connect_switch).state) return;
        if (x == mqtt::MQTTClientDisconnectReason::DNS_RESOLVE_ERROR) {
          id(mqtt_status_text).publish_state("Connection error - can't resolve broker address");
        } else {
          id(mqtt_status_text).publish_state("Connection error");
        }

# Silences the MQTT wrapper components' own one-time boot dump_config()
# spam (~200 lines, see this file's own header comment) without touching
# MQTT's actual runtime behavior at all - see that comment for the full
# "why this is the right fix, and what it isn't" reasoning. Merges into
# water-collector.yaml's own top-level `logger:` block (which has no
# `logs:` key of its own) via ESPHome's packages: dict-merge, the same
# mechanism every other key in this file relies on. Every tag a `[C]`-
# level MQTT wrapper line in a real boot log used any of - `mqtt` itself
# plus one per wrapped domain - confirmed against that log line by line,
# not guessed. WARN (not NONE): still lets a genuine connection problem
# surface as a `[W]`/`[E]` line from the same tags, only the routine
# CONFIG-level printout is gone.
logger:
  logs:
    mqtt: WARN
    mqtt.sensor: WARN
    mqtt.binary_sensor: WARN
    mqtt.switch: WARN
    mqtt.text: WARN
    mqtt.text_sensor: WARN
    mqtt.number: WARN
    mqtt.button: WARN

text_sensor:
  # Driven by mqtt:'s own on_connect:/on_disconnect: triggers above -
  # direct, at-a-glance feedback on whether the last connection attempt
  # (with whatever broker/credentials are currently saved) actually
  # succeeded, per the explicit request ("legyen visszajelzés a jó/
  # nemjó connectionről"). "Disabled" (not just silence) while MQTT
  # Enabled is off - set by that switch's own turn_off_action below, not
  # by mqtt: itself (which has no "disabled" concept of its own, only
  # connected/disconnected).
  - platform: template
    id: mqtt_status_text
    name: "MQTT Status"
    icon: "mdi:server-network"
    entity_category: diagnostic
    disabled_by_default: true
    web_server:
      sorting_group_id: sorting_group_mqtt
      sorting_weight: 50

switch:
  # Master Enable/Disable for MQTT - CONSOLIDATED, 2026-08-16, direct
  # feedback ("bal oldalt a státusz alatt enable/disable gomb... jobb
  # oldalt státusz mezőben ki tudjuk írni: connected/disconnected/
  # disabled" (left: below status, an enable/disable BUTTON, not a
  # slider; right: the status field shows connected/disconnected/
  # disabled) - REVISED AGAIN, 2026-08-16 (direct follow-up feedback):
  # "Az enabled csak annyit kell csináljon hogy bekapcsolja a
  # komponenseket (settings, connect/disconnect, sttings dialog) - ha
  # disabledet nyomunk, akkor az disconnectál és kikapcsolja a
  # komponenseket" (Enabled should only turn the components on -
  # settings, connect/disconnect, settings dialog; pressing Disabled
  # disconnects AND turns the components off). This is back to being a
  # pure UI-visibility gate, NOT the connect/disconnect action itself -
  # the brief merge earlier this same day (see this comment's own
  # history) is reverted; the actual connect/disconnect action is now
  # "MQTT Connect", its own separate switch, right below.
  #
  # turn_on_action: none needed - flipping this switch on is purely "the
  # other components may now render" as far as the C++ side is concerned,
  # dashboard.js reads this switch's own state to decide what else to
  # show (ensureMqttHeader()/updateMqttFieldsVisibility()).
  #
  # turn_off_action: forces a real disconnect via `switch.turn_off:` on
  # "MQTT Connect" below (running THAT switch's own full turn_off_action -
  # disable() the client, clear mqtt_want_connected, publish a status),
  # then overwrites the status to "Disabled" specifically (distinct from
  # plain "Disconnected" - this is "the whole feature turned off", not
  # just "not currently connected"). Deliberately does NOT wipe the saved
  # fields (Broker/Username/Password/Topic Prefix) - that was the OLD
  # "Huszonnegyedik kör" reset-toggle behavior; a full field-clear would
  # be an unpleasant surprise on a plain "hide the settings" press. If a
  # hard reset is ever wanted again, that's a separate feature to design.
  - platform: template
    id: mqtt_enabled_switch
    name: "MQTT Enabled"
    icon: "mdi:server-network"
    entity_category: config
    disabled_by_default: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: sorting_group_mqtt
      sorting_weight: 10
    turn_off_action:
      - switch.turn_off: mqtt_connect_switch
      - text_sensor.template.publish:
          id: mqtt_status_text
          state: "Disabled"

  # The actual connect/disconnect action - a single switch rendered as
  # one button whose label/state flips between "Connect" and
  # "Disconnect" (dashboard.js's own updateMqttConnectButton(), same
  # button-not-toggle-pill treatment as "MQTT Enabled" above) - direct
  # feedback, 2026-08-16: "legyen egy connect/disconnect gomb (állapottól
  # függően)" (there should be one connect/disconnect button, depending
  # on state). Only reachable through the dashboard while "MQTT Enabled"
  # is on (that switch's own components-gate role, see above) - the
  # underlying entity itself has no such restriction, same "dashboard
  # placement is independent of the entity's own always-exists model"
  # pattern this whole file already follows elsewhere.
  #
  # turn_on_action: id(mqtt_id).disable() BEFORE re-applying credentials
  # and calling enable() - direct feedback, 2026-08-16, a real bug:
  # "hiba után... kétszer is kellett kattintani a connect gombra" (after
  # an error, had to click Connect twice) - confirmed reading ESPHome's
  # own mqtt_client.cpp: MQTTClientComponent::enable() is a NO-OP unless
  # the client is currently in the DISABLED state (`if (this->state_ !=
  # MQTT_CLIENT_DISABLED) return;`) - so pressing this again after a
  # failed attempt (state is DISCONNECTED/CONNECTING, never DISABLED)
  # silently did nothing until whatever automatic retry the client was
  # already going to do anyway happened to fire, which read as "had to
  # click twice". disable() forces state_ back to DISABLED first, so the
  # following enable() is guaranteed to actually start a fresh connection
  # attempt with whatever's currently in the fields, every single press.
  - platform: template
    id: mqtt_connect_switch
    name: "MQTT Connect"
    icon: "mdi:server-network"
    entity_category: config
    disabled_by_default: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: sorting_group_mqtt
      sorting_weight: 15
    turn_on_action:
      - lambda: |-
          id(mqtt_id).disable();
          std::string mqtt_host;
          uint16_t mqtt_port;
          mqtt_broker_url::parse(id(mqtt_broker_text).state, mqtt_host, mqtt_port);
          id(mqtt_id).set_broker_address(mqtt_host);
          id(mqtt_id).set_broker_port(mqtt_port);
          id(mqtt_id).set_username(id(mqtt_username_text).state);
          id(mqtt_id).set_password(id(mqtt_password_stored).state);
          id(mqtt_id).set_topic_prefix(id(mqtt_topic_prefix_text).state, "${device_name}");
          id(mqtt_id).enable();
          // Remembered across a reboot (globals: mqtt_want_connected
          // above) - a connected session should resume automatically
          // after a reboot, an explicitly disconnected one shouldn't.
          id(mqtt_want_connected) = true;
      - text_sensor.template.publish:
          id: mqtt_status_text
          state: "Connecting…"
      - delay: 10ms
      - lambda: global_preferences->sync();
    turn_off_action:
      - lambda: |-
          id(mqtt_id).disable();
          id(mqtt_want_connected) = false;
      - delay: 10ms
      - lambda: global_preferences->sync();
      - text_sensor.template.publish:
          id: mqtt_status_text
          state: "Disconnected"

text:
  # MQTT broker - plain, visible, persisted directly (restore_value:
  # true) like Display Name - not sensitive the way the password is, no
  # special handling needed. Applied the next time "MQTT Enabled" is
  # turned on (switch: below), not live on every keystroke - matches this
  # project's established pattern for multi-field settings that should
  # be committed together (Reading/Update, Add Name/Add Target Address/
  # Add), not one field at a time. No separate Port field (2026-08-15,
  # direct feedback) - accepts a bare host, "host:port", or
  # "scheme://host:port" (mqtt_broker_url::parse(), include/
  # mqtt_broker_url.h) - the dashboard's own help text (HELP_TEXT,
  # web/dashboard.js) spells this out.
  - platform: template
    id: mqtt_broker_text
    name: "MQTT Broker"
    icon: "mdi:server-network"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 64
    entity_category: config
    disabled_by_default: true
    set_action:
      - delay: 10ms
      - lambda: global_preferences->sync();
    web_server:
      sorting_group_id: sorting_group_mqtt
      sorting_weight: 20

  - platform: template
    id: mqtt_username_text
    name: "MQTT Username"
    icon: "mdi:account"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 64
    entity_category: config
    disabled_by_default: true
    set_action:
      - delay: 10ms
      - lambda: global_preferences->sync();
    web_server:
      sorting_group_id: sorting_group_mqtt
      sorting_weight: 30

  # Answers the user's own question, 2026-08-15 ("a topic nevét nem
  # kéne tudni megadni, szerkeszteni?" - shouldn't the topic name also
  # be settable/editable?) - yes, and it's genuinely simple to add:
  # MQTTClientComponent::set_topic_prefix() is just as public as the
  # broker/credential setters. Defaults to the device's own compile-time
  # name (matches what a plain, unconfigured mqtt: block would use on
  # its own), editable the same way as everything else here.
  - platform: template
    id: mqtt_topic_prefix_text
    name: "MQTT Topic Prefix"
    icon: "mdi:folder-network"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${device_name}"
    min_length: 0
    max_length: 64
    entity_category: config
    disabled_by_default: true
    set_action:
      - delay: 10ms
      - lambda: global_preferences->sync();
    web_server:
      sorting_group_id: sorting_group_mqtt
      sorting_weight: 50

  # The REAL, persisted password - entity_category: config but never
  # rendered directly (internal: true - excluded from web_server's own
  # REST/SSE surface entirely, see web_server.cpp's own include_internal_
  # check, confirmed by reading the installed esphome package's source),
  # only ever reached via id() from a lambda. This is the actual
  # plaintext-in-flash storage the user explicitly confirmed acceptable,
  # 2026-08-15 ("a jelszó titkosítatlanul kerül a flash-be... elfogadható")
  # - MQTT client auth needs the real password at every connect, not a
  # one-way hash (unlike a login password, ld. REQUIREMENTS.md's own
  # "MQTT-integráció" section for the fuller reasoning).
  - platform: template
    id: mqtt_password_stored
    name: "MQTT Password (Stored)"
    mode: password
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 64
    internal: true
    set_action:
      - delay: 10ms
      - lambda: global_preferences->sync();

  # The VISIBLE password field the user actually types into - deliberately
  # write-only: restore_value: false (nothing to restore - this field's
  # own persisted state is never the source of truth) and its set_action
  # copies the typed value into mqtt_password_stored above, then resets
  # itself via publish_state() (NOT text.set - that would re-invoke this
  # very set_action, wiping the password it just copied a moment
  # earlier) to either "" (password cleared - typing an empty value and
  # submitting IS how you clear it) or a fixed 8-bullet placeholder
  # "••••••••" (direct feedback, 2026-08-15: "Ha megadom a jelszót akkor
  # legyen benne ******" - once a password is set, show *something*
  # there, not just blank, so it's obvious one is configured) - NOT the
  # real password or its real length, still fully write-only.
  #
  # mode: text, deliberately NOT mode: password - confirmed by reading
  # ESPHome's own web_server.cpp (text_json_()): a mode: password text
  # entity's reported `value` is UNCONDITIONALLY replaced with a literal
  # "********" by the SERVER ITSELF, regardless of the entity's actual
  # state (even an empty one) - there would be no way to tell "nothing
  # set yet" (should show blank) apart from "something's set" (should
  # show the dots placeholder) if this used mode: password, since the
  # server always reports the same fixed mask either way. Using mode:
  # text instead means the browser gets this field's REAL, self-chosen
  # state ("" or "••••••••") verbatim, and the masked, dots-while-typing
  # *keystroke* behavior is instead applied purely client-side
  # (`input.type = "password"`, web/dashboard.js's own "MQTT Password"
  # special-case, same place it also adds the eye/reveal toggle) - two
  # different, independently-solved kinds of masking that happened to
  # look like they needed the same YAML flag at first glance.
  #
  # The placeholder is also applied once at boot if a password is
  # already stored from a previous session (esphome: on_boot: above) -
  # this field's own restore_value: false means it would otherwise start
  # blank even with a real password already saved. dashboard.js clears
  # the placeholder back to "" on focus, so typing a new password always
  # starts from an empty field, never accidentally appends to/overwrites
  # with the literal dots. See this project's REQUIREMENTS.md for the
  # one honest caveat this doesn't cover (the typed value still appears
  # once, in plaintext, in the set request's own body/SSE echo - inherent
  # to how ESPHome's web_server REST API works, not something client-
  # side masking can hide, and not a new exposure beyond this
  # dashboard's already-accepted "local network only, no login, no TLS"
  # threat model).
  - platform: template
    id: mqtt_password_text
    name: "MQTT Password"
    icon: "mdi:key"
    mode: text
    optimistic: true
    restore_value: false
    initial_value: ""
    min_length: 0
    max_length: 64
    entity_category: config
    disabled_by_default: true
    set_action:
      - lambda: |-
          id(mqtt_password_stored).make_call().set_value(x).perform();
      - delay: 10ms
      - lambda: |-
          global_preferences->sync();
          id(mqtt_password_text).publish_state(x.empty() ? "" : "••••••••");
    web_server:
      sorting_group_id: sorting_group_mqtt
      sorting_weight: 31
