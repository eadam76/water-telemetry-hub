# Pressure sensor slot - reusable ESPHome package.
#
# One of 8 fixed "slots" for a QDW90A RS485/Modbus pressure sensor - see
# REQUIREMENTS.md (Hungarian), "Nyomásmérő modul" / "Architekturális
# megfontolás: dinamikus nyomásmérő-hozzáadás" for the full rationale.
# ESPHome has no runtime entity creation, so this is the same workaround
# already used for the water meters (packages/water_meter.yaml): N
# pre-wired, individually configurable slots instead of true dynamic
# add/remove.
#
# STATUS: this is the commissioning-UX skeleton only, built to be tried
# out for usability before the real thing exists. Real Modbus polling
# (reading the actual sensor over RS485 through the E810-R14 hub) isn't
# implemented yet - it waits for the Waveshare ESP32-S3-RS485-CAN board to
# physically arrive (see REQUIREMENTS.md, "Státusz"). Until then, "Mock
# Pressure (Test)" below is a manual stand-in so the Modbus Address/
# Display Name/Delete flow can be built and clicked through on the
# current esp32dev test board. DELETE the Mock Pressure number once real
# Modbus polling replaces it - everything else in this file (address/name
# persistence, Delete) stays as-is.
#
# "Commissioned"/"empty" is a value convention, not a separate flag:
# Modbus Address == 0 means "this slot has never been commissioned, or was
# just deleted" - 1-247 means "commissioned, holds this Modbus slave
# address". web/dashboard.js reads this same sentinel (isSlotCommissioned())
# to decide whether a slot's Home card should exist at all.
#
# Instantiate per slot from the top-level config (water-collector.yaml)
# via `!include ... vars:`. Required vars:
#   id_prefix         - unique internal id prefix, e.g. slot1 / slot2 / ...
#                        (never shown anywhere - same caveat as
#                        water_meter.yaml's id_prefix: renaming an
#                        *already-commissioned* slot's id_prefix loses its
#                        saved Modbus address/Display Name, since both are
#                        keyed on it in flash)
#   friendly_name     - display name, deliberately generic, e.g.
#                        "Pressure Sensor 1" - also the "Display Name"
#                        field's starting value, and what Delete resets it
#                        back to
#   sorting_group_id  - web_server sorting group id for this slot's own
#                        Service-page section (declared in
#                        water-collector.yaml)

sensor:
  # The actual reading shown on the Home page - unset entity_category (not
  # disabled_by_default), same as the meters' Flow Rate/Total Consumption:
  # this is the device's actual job, not a diagnostic. Only published from
  # the Mock Pressure number for now (see the file header) - a real Modbus
  # read will call the same publish_state() once that's wired up.
  - platform: template
    id: ${id_prefix}_pressure
    name: "${friendly_name} Pressure"
    icon: "mdi:gauge"
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 2
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 10

number:
  # The "betanítás" field - Modbus slave address for this slot's sensor.
  # 0 is the "not commissioned" sentinel (see file header), 1-247 is a
  # real address. restore_value: true + the delay/sync set_action is the
  # same immediate-flash-write pattern as water_meter.yaml's Zero-Flow
  # Timeout - survives a restart, and doesn't wait for flash_write_interval.
  - platform: template
    id: ${id_prefix}_modbus_address
    name: "${friendly_name} Modbus Address"
    icon: "mdi:identifier"
    mode: box
    min_value: 0
    max_value: 247
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 0
    entity_category: config
    disabled_by_default: true
    set_action:
      - delay: 10ms
      - lambda: global_preferences->sync();
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 20

  # TEMPORARY test scaffold - see the file header. Stands in for a real
  # Modbus read: move/type a value here and it publishes straight to the
  # Pressure sensor above, so the commissioning UX and Home page rendering
  # can be tried out without the RS485 hardware in hand. Delete this whole
  # entity (and the matching line in the Delete button below) once real
  # Modbus polling is wired up.
  - platform: template
    id: ${id_prefix}_mock_pressure
    name: "${friendly_name} Mock Pressure (Test)"
    icon: "mdi:test-tube"
    unit_of_measurement: "bar"
    mode: box
    min_value: 0
    max_value: 10
    step: 0.1
    optimistic: true
    restore_value: false
    initial_value: 0
    entity_category: config
    disabled_by_default: true
    set_action:
      - lambda: id(${id_prefix}_pressure).publish_state(x);
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 90

text:
  # Same pattern/purpose as water_meter.yaml's Display Name - renameable
  # per-installation label, shown on this slot's Home card and Service/
  # Diagnostics section header instead of the fixed "${friendly_name}".
  - platform: template
    id: ${id_prefix}_display_name
    name: "${friendly_name} Display Name"
    icon: "mdi:rename-box"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${friendly_name}"
    min_length: 0
    max_length: 32
    entity_category: config
    disabled_by_default: true
    set_action:
      - delay: 10ms
      - lambda: global_preferences->sync();
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 30

button:
  # Resets this slot back to its uncommissioned state - Modbus Address ->
  # 0 (the sentinel, see file header), Display Name/Mock Pressure back to
  # their defaults. Goes through number.set/text.set (not a direct field
  # assignment) specifically so each entity's own set_action fires exactly
  # like a UI-driven change would - the delay+sync immediate-persist logic
  # above isn't duplicated here, it's just triggered the normal way.
  #
  # Confirmed before firing on the dashboard itself (see CONFIRM_ON_PRESS
  # in web/dashboard.js) - same pattern as Update/Restart/Forget Wi-Fi, no
  # separate YAML-side confirmation step needed.
  - platform: template
    id: ${id_prefix}_delete
    name: "${friendly_name} Delete"
    icon: "mdi:delete-outline"
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 100
    on_press:
      - number.set:
          id: ${id_prefix}_modbus_address
          value: 0
      - text.set:
          id: ${id_prefix}_display_name
          value: "${friendly_name}"
      - number.set:
          id: ${id_prefix}_mock_pressure
          value: 0
      - lambda: id(${id_prefix}_pressure).publish_state(NAN);
