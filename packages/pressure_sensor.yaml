# Pressure sensor slot - reusable ESPHome package.
#
# One of 4 fixed "slots" for a QDW90A RS485/Modbus pressure sensor - see
# REQUIREMENTS.md (Hungarian), "Nyomásmérő modul" for the full rationale.
#
# STATUS: commissioning-UX skeleton only, still mock data (see "Mock
# Pressure (Test)" below) - real Modbus polling waits for the Waveshare
# board (REQUIREMENTS.md "Státusz").
#
# EXISTENCE MODEL (v2): every entity below is a normal, always-compiled-in,
# never-`internal` entity - NOT hidden via ESPHome's `internal`/
# `set_internal()` mechanism. That was the first design tried here, and
# was reverted after reading ESPHome's own current source
# (esphome/core/entity_base.h, the installed package): calling
# set_internal() at runtime is explicitly documented as deprecated/
# undefined behavior since 2026.3.0 ("components and Home Assistant are
# NOT notified... Use the 'internal:' YAML key instead" - i.e. compile-time
# only), due to be removed in 2027.3.0. Not a viable foundation.
#
# Instead, "commissioned or not" is a plain VALUE - the
# ${id_prefix}_commissioned binary_sensor below - which every client
# (this project's own dashboard, Home Assistant) receives like any other
# entity's state, live, through fully-supported means. web/dashboard.js
# reads this value to decide whether to build/remove this slot's Home
# card and Service-page table row - see isCommissioned()/syncPressureSlot()
# there. Home Assistant, by contrast, has no equivalent client-side logic
# of our own to lean on - it will always be able to see (a disabled-by-
# default) entity for every one of the 4 slots, regardless of whether
# they're actually commissioned. That's a real, accepted gap against
# "only visible sensors go to HA" - ESPHome doesn't support anything
# stronger without abandoning its native API integration for something
# else entirely (e.g. MQTT discovery, a much bigger change, not done here).
#
# Instantiate per slot from the top-level config (water-collector.yaml)
# via `!include ... vars:`. Required vars:
#   id_prefix         - unique internal id prefix, e.g. slot1 / slot2 / ...
#                        (never shown anywhere - which physical slot
#                        number a sensor happens to occupy is deliberately
#                        meaningless; only its Display Name is ever shown -
#                        see water-collector.yaml's Add Pressure Sensor
#                        button for why slot order otherwise doesn't matter)
#   friendly_name     - fallback Display Name if a sensor is commissioned
#                        with an empty name; also this slot's compiled-in
#                        entity name prefix (never shown in the custom
#                        dashboard UI, which always renders the Display
#                        Name instead - could still appear in Home
#                        Assistant's own entity IDs)
#   sorting_group_id  - web_server sorting group id for this slot
#                        (declared in water-collector.yaml) - purely an
#                        internal grouping key, never shown as a label
#                        (the dashboard's own pressure table renders from
#                        each entity's Display Name, not group names)

globals:
  # Persisted explicitly (own ESPPreferenceObject, load on_boot below,
  # save in try_commission/Delete) rather than the `globals:`
  # restore_value:true mechanism - same reasoning as water_meter.yaml's
  # offset_m3: that mechanism only flushes via the globals component's
  # own 1s polling, so an immediate sync() right after assigning it could
  # miss the write, and this has to survive a power loss the instant it
  # changes.
  - id: ${id_prefix}_commissioned
    type: bool
    restore_value: false
    initial_value: "false"

binary_sensor:
  # Read-only signal, not a user-facing setting - see the file header.
  # Published explicitly (on_boot below, try_commission, Delete), never
  # polled - same "manual publish, no update schedule" pattern as the
  # Pressure sensor below.
  - platform: template
    id: ${id_prefix}_commissioned_sensor
    name: "${friendly_name} Commissioned"
    icon: "mdi:check-decagram-outline"
    entity_category: diagnostic
    disabled_by_default: true
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 5

sensor:
  # The actual reading, shown on the Home page once commissioned - see
  # dashboard.js. disabled_by_default here (unlike the water meters' own
  # Flow Rate/Total Consumption) is a deliberate exception to this
  # project's usual "the device's actual job is enabled by default" rule:
  # since Home Assistant can't be kept from seeing an uncommissioned
  # slot's entities at all (see file header), the least-surprising
  # default is for a fresh HA connection to show 4 disabled pressure
  # sensors rather than 4 enabled-but-meaningless ones - opt in per slot
  # once it's actually commissioned.
  - platform: template
    id: ${id_prefix}_pressure
    name: "${friendly_name} Pressure"
    icon: "mdi:gauge"
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 2
    disabled_by_default: true
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 10

number:
  - platform: template
    id: ${id_prefix}_modbus_address
    name: "${friendly_name} Modbus Address"
    icon: "mdi:identifier"
    mode: box
    min_value: 0
    max_value: 247
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 0
    entity_category: config
    disabled_by_default: true
    set_action:
      - delay: 10ms
      - lambda: global_preferences->sync();
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 20

  # TEMPORARY test scaffold - see the status note in the file header.
  # Delete this whole entity (and the matching line in try_commission's
  # reset/Delete's reset) once real Modbus polling replaces it.
  - platform: template
    id: ${id_prefix}_mock_pressure
    name: "${friendly_name} Mock Pressure (Test)"
    icon: "mdi:test-tube"
    unit_of_measurement: "bar"
    mode: box
    min_value: 0
    max_value: 10
    step: 0.1
    optimistic: true
    restore_value: false
    initial_value: 0
    entity_category: config
    disabled_by_default: true
    set_action:
      - lambda: id(${id_prefix}_pressure).publish_state(x);
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 90

text:
  - platform: template
    id: ${id_prefix}_display_name
    name: "${friendly_name} Display Name"
    icon: "mdi:rename-box"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${friendly_name}"
    min_length: 0
    max_length: 32
    entity_category: config
    disabled_by_default: true
    set_action:
      - delay: 10ms
      - lambda: global_preferences->sync();
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 30

button:
  # Un-commissions this slot: resets Modbus Address/Display Name/Mock
  # Pressure to their defaults and publishes Commissioned -> false.
  # Confirmed before firing on the dashboard itself (CONFIRM_ON_PRESS in
  # web/dashboard.js), same pattern as Update/Restart/Forget Wi-Fi.
  - platform: template
    id: ${id_prefix}_delete
    name: "${friendly_name} Delete"
    icon: "mdi:delete-outline"
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 100
    on_press:
      - number.set:
          id: ${id_prefix}_modbus_address
          value: 0
      - text.set:
          id: ${id_prefix}_display_name
          value: "${friendly_name}"
      - number.set:
          id: ${id_prefix}_mock_pressure
          value: 0
      - lambda: |-
          id(${id_prefix}_pressure).publish_state(NAN);
          id(${id_prefix}_commissioned) = false;
          static auto pref = global_preferences->make_preference<bool>(fnv1a_hash("${id_prefix}_commissioned"));
          pref.save(&id(${id_prefix}_commissioned));
          global_preferences->sync();
      - binary_sensor.template.publish:
          id: ${id_prefix}_commissioned_sensor
          state: false

script:
  # Called (unconditionally, on every press) from water-collector.yaml's
  # top-level "Add Pressure Sensor" button, once per slot in sequence - a
  # no-op if this slot is already commissioned, so whichever slot is
  # first still-free in that sequence is the one that actually claims the
  # given name. Which slot number ends up claimed is otherwise never
  # shown/meaningful - see the id_prefix note in the file header.
  - id: ${id_prefix}_try_commission
    mode: single
    parameters:
      name: string
    then:
      - if:
          condition:
            lambda: 'return !id(${id_prefix}_commissioned);'
          then:
            - text.set:
                id: ${id_prefix}_display_name
                value: !lambda 'return name.empty() ? std::string("${friendly_name}") : name;'
            - lambda: |-
                id(${id_prefix}_commissioned) = true;
                static auto pref = global_preferences->make_preference<bool>(fnv1a_hash("${id_prefix}_commissioned"));
                pref.save(&id(${id_prefix}_commissioned));
                global_preferences->sync();
            - binary_sensor.template.publish:
                id: ${id_prefix}_commissioned_sensor
                state: true

esphome:
  on_boot:
    then:
      - lambda: |-
          static auto pref = global_preferences->make_preference<bool>(fnv1a_hash("${id_prefix}_commissioned"));
          bool loaded = false;
          if (pref.load(&loaded)) {
            id(${id_prefix}_commissioned) = loaded;
          }
      - binary_sensor.template.publish:
          id: ${id_prefix}_commissioned_sensor
          state: !lambda 'return id(${id_prefix}_commissioned);'
