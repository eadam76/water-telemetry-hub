# Pressure sensor slot - reusable ESPHome package.
#
# One of 8 fixed "slots" for a QDW90A RS485/Modbus pressure sensor - see
# REQUIREMENTS.md (Hungarian), "Nyomásmérő modul" for the full rationale,
# and "Architekturális megfontolás v3" (2026-08-13) for the design this
# file implements.
#
# STATUS: commissioning-UX skeleton only, still mock data (see "Mock
# Pressure (Test)" below) - real Modbus polling waits for the Waveshare
# board (REQUIREMENTS.md "Státusz").
#
# EXISTENCE MODEL (v3): every entity below is a normal, always-compiled-in,
# never-`internal` entity (same "don't rely on deprecated set_internal()"
# reasoning as v2 - see git history for that finding).
#
# PERSISTENT DATA MODEL (v3, simplified from v2): a slot has exactly two
# persisted fields - Modbus Address and Display Name. That's it. v2 also
# had a separate "Commissioned" bool/binary_sensor; v3 drops it entirely -
# "registered or not" is now derived purely from Modbus Address != 0 (the
# same sentinel v1 originally used), both in firmware (this file) and in
# the dashboard's own join logic (web/dashboard.js). One fewer persisted
# concept, one fewer thing that could drift out of sync with the address.
#
# Instantiate per slot from the top-level config (water-collector.yaml)
# via `!include ... vars:`. Required vars:
#   id_prefix         - unique internal id prefix, e.g. slot1 / slot2 / ...
#                        (never shown anywhere - which physical slot
#                        number a sensor happens to occupy is deliberately
#                        meaningless; only its Display Name is ever shown -
#                        see water-collector.yaml's bus-scan/Add flow for
#                        why slot order otherwise doesn't matter)
#   friendly_name     - fallback Display Name if a sensor is commissioned
#                        with an empty name; also this slot's compiled-in
#                        entity name prefix (never shown in the custom
#                        dashboard UI, which always renders the Display
#                        Name instead - could still appear in Home
#                        Assistant's own entity IDs)
#   sorting_group_id  - web_server sorting group id for this slot
#                        (declared in water-collector.yaml) - purely an
#                        internal grouping key, never shown as a label
#                        (the dashboard's own pressure table renders from
#                        each entity's Display Name, not group names)

sensor:
  # The actual reading, shown on the Home page once registered - see
  # dashboard.js. disabled_by_default here (unlike the water meters' own
  # Flow Rate/Total Consumption) is a deliberate exception to this
  # project's usual "the device's actual job is enabled by default" rule:
  # since Home Assistant can't be kept from seeing an unregistered slot's
  # entities at all (ESPHome has no supported way to hide an entity from
  # HA at runtime - see git history), the least-surprising default is for
  # a fresh HA connection to show 8 disabled pressure sensors rather than
  # 8 enabled-but-meaningless ones - opt in per slot once it's actually
  # registered.
  - platform: template
    id: ${id_prefix}_pressure
    name: "${friendly_name} Pressure"
    icon: "mdi:gauge"
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 2
    disabled_by_default: true
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 10

number:
  # The single source of truth for "registered or not" - see the file
  # header. 0 = empty slot, 1-247 = a real Modbus address. Restored from
  # flash on boot (restore_value: true), same as Display Name below - no
  # separate persisted flag needed on top of this.
  - platform: template
    id: ${id_prefix}_modbus_address
    name: "${friendly_name} Modbus Address"
    icon: "mdi:identifier"
    mode: box
    min_value: 0
    max_value: 247
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 0
    entity_category: config
    disabled_by_default: true
    set_action:
      - delay: 10ms
      - lambda: global_preferences->sync();
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 20

  # TEMPORARY test scaffold - see the status note in the file header.
  # Delete this whole entity (and the matching line in try_register's
  # reset/Delete's reset) once real Modbus polling replaces it.
  - platform: template
    id: ${id_prefix}_mock_pressure
    name: "${friendly_name} Mock Pressure (Test)"
    icon: "mdi:test-tube"
    unit_of_measurement: "bar"
    mode: box
    min_value: 0
    max_value: 10
    step: 0.1
    optimistic: true
    restore_value: false
    initial_value: 0
    entity_category: config
    disabled_by_default: true
    set_action:
      - lambda: id(${id_prefix}_pressure).publish_state(x);
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 90

text:
  - platform: template
    id: ${id_prefix}_display_name
    name: "${friendly_name} Display Name"
    icon: "mdi:rename-box"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${friendly_name}"
    min_length: 0
    max_length: 32
    entity_category: config
    disabled_by_default: true
    set_action:
      - delay: 10ms
      - lambda: global_preferences->sync();
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 30

button:
  # Un-registers this slot: resets Modbus Address back to 0 (the "empty"
  # sentinel - see file header), Display Name/Mock Pressure back to their
  # defaults. Confirmed before firing on the dashboard itself
  # (CONFIRM_ON_PRESS in web/dashboard.js), same pattern as Update/
  # Restart/Forget Wi-Fi.
  #
  # NOTE (v3, not yet implemented): once real Modbus polling exists, this
  # should probably also offer to factory-reset/re-address the physical
  # sensor rather than just forgetting it locally - out of scope for this
  # pass, tracked in REQUIREMENTS.md.
  - platform: template
    id: ${id_prefix}_delete
    name: "${friendly_name} Delete"
    icon: "mdi:delete-outline"
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: ${sorting_group_id}
      sorting_weight: 100
    on_press:
      - number.set:
          id: ${id_prefix}_modbus_address
          value: 0
      - text.set:
          id: ${id_prefix}_display_name
          value: "${friendly_name}"
      - number.set:
          id: ${id_prefix}_mock_pressure
          value: 0
      - lambda: id(${id_prefix}_pressure).publish_state(NAN);

script:
  # Called (unconditionally, on every press) from water-collector.yaml's
  # per-discovered-address "Add" buttons, once per slot in sequence - a
  # no-op if this slot's address is already non-zero (registered), so
  # whichever slot is first still-free in that sequence is the one that
  # actually claims the given address+name. Which slot number ends up
  # claimed is otherwise never shown/meaningful - see the id_prefix note
  # in the file header.
  #
  # Takes the address as a parameter now (v3) rather than always writing
  # 0 and leaving it to be typed in later (v2) - the bus-scan/Add flow
  # already knows the address before Add is ever pressed.
  - id: ${id_prefix}_try_register
    mode: single
    parameters:
      name: string
      address: int
    then:
      - if:
          condition:
            lambda: 'return id(${id_prefix}_modbus_address).state == 0;'
          then:
            - text.set:
                id: ${id_prefix}_display_name
                value: !lambda 'return name.empty() ? std::string("${friendly_name}") : name;'
            - number.set:
                id: ${id_prefix}_modbus_address
                value: !lambda 'return address;'
